<!DOCTYPE html>
<meta charset="UTF-8">
<title>순회검사(모바일)</title>
<!-- T3MES UI Pattern · mes_qc_1_operation · TabPage #7: 순회검사(모바일) -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p6">
    <div class="sec-hdr"><div><h3>⑦ 순회 검사 (Patrol Inspection) 체크리스트</h3><span class="tip">품질 담당자가 태블릿을 들고 현장을 돌아다니며 체크리스트 O/X를 쳐서 공정 품질 이상 유무를 점검하는 모바일 뷰입니다.</span></div></div>
    <div class="mobile-frame">
      <div style="padding:20px;background:var(--green);color:#fff;font-weight:700;text-align:center">📱 정기 순회 검사</div>
      <div style="padding:20px">
        <div style="font-size:16px;font-weight:700;margin-bottom:20px">대상: CNC 조립 1라인 (오전조)</div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)"><span>1. 작업표준서(SOP) 준수 여부</span><div style="display:flex;gap:4px"><button class="btn btn-green btn-sm">O</button><button class="btn btn-ghost btn-sm">X</button></div></div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)"><span>2. 정전기(ESD) 방지 밴드 착용</span><div style="display:flex;gap:4px"><button class="btn btn-ghost btn-sm">O</button><button class="btn btn-red btn-sm">X</button></div></div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)"><span>3. 계측기 0점 세팅 상태</span><div style="display:flex;gap:4px"><button class="btn btn-green btn-sm">O</button><button class="btn btn-ghost btn-sm">X</button></div></div>
        <button class="btn btn-green" style="width:100%;margin-top:30px;padding:14px" onclick="showToast('순회검사 결과가 등록되었습니다. ESD 미착용 1건 부적합.')">검사 결과 제출 (Submit)</button>
      </div>
    </div>
  </div>
