<!DOCTYPE html>
<meta charset="UTF-8">
<title>🛒 구매 관리</title>
<!-- T3MES UI Pattern · scm_snop_1 · TabPage #3: 🛒 구매 관리 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p2">
    <div class="grid-top">
      <div class="kpi-card" style="grid-column: span 2;">
        <div class="card-title">협력사 납기 준수율 (Supplier OTD)</div>
        <div style="display:flex;align-items:center;gap:30px">
          <div class="donut-wrap" style="background:conic-gradient(var(--c-pur) 88%, var(--surface3) 0)">
            <div class="donut-inner"><div class="donut-val c-pur">88%</div><div class="donut-lbl">목표: 95%</div></div>
          </div>
          <div>
            <div style="margin-bottom:10px"><span style="color:var(--text2)">입고 지연 건수:</span> <b style="font-size:18px;font-family:var(--mono);color:var(--c-qal)">145 건</b></div>
            <div class="trend t-dn">▼ 3%p (해상물류 지연)</div>
          </div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="card-title">자재 결품 발생 횟수</div>
        <div class="val-l c-qal">12 건</div>
        <div class="tip">라인 스톱 유발: 2건</div>
        <div class="pg-wrap"><div class="pg-bar bg-qal" style="width:40%"></div></div>
      </div>
      <div class="kpi-card" style="grid-column: span 2;">
        <div class="card-title">구매 예산 vs 실제 집행액 (Cost Saving)</div>
        <div class="val-l c-pur">₩ 4.1B <span style="font-size:14px;color:var(--text2)">/ 4.5B (예산)</span></div>
        <div style="margin-top:10px;font-size:13px;color:var(--c-all);font-weight:700">✓ ₩ 400M 예산 절감 (단가 인하)</div>
      </div>
    </div>
    <div class="grid-mid">
      <div class="kpi-card">
        <div class="card-title">📈 원자재 단가 변동 추이 (주요 3품목)</div>
        <div style="position:relative;height:200px;width:100%;margin-top:20px" id="svg-wrap-pur-1"></div>
      </div>
      <div class="kpi-card">
        <div class="card-title">⚠️ 하위 평가 협력사 (Vendor Rating)</div>
        <table class="kpi-tbl">
          <tr><th>협력사명</th><th>지연(건)</th><th>불량(PPM)</th><th>등급</th></tr>
          <tr><td>성진스틸</td><td class="num">15</td><td class="num">4,500</td><td style="color:var(--c-qal);font-weight:700">C</td></tr>
          <tr><td>우진테크</td><td class="num">12</td><td class="num">3,200</td><td style="color:var(--c-qal);font-weight:700">C</td></tr>
          <tr><td>제일화학</td><td class="num">8</td><td class="num">2,100</td><td style="color:var(--c-pur);font-weight:700">B</td></tr>
        </table>
      </div>
    </div>
  </div>
