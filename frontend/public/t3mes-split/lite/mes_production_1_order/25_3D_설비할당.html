<!DOCTYPE html>
<meta charset="UTF-8">
<title>3D 설비할당</title>
<!-- T3MES UI Pattern · mes_production_1_order · TabPage #25: 3D 설비할당 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p24">
    <div class="sec-hdr"><div><h3>㉕ 3D 디지털 트윈 설비 직접 할당</h3><span class="tip">글자 표 대신, 공장의 3D 모델링 화면에서 비어있는(초록색) 설비 모델을 직접 클릭해 지시를 던져넣는 초직관적 UI입니다.</span></div></div>
    <div class="grid2" style="height:500px">
      <div style="background:#000;border-radius:12px;border:1px solid var(--border);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden">
        <div style="position:absolute;width:200%;height:200%;background:repeating-linear-gradient(45deg, #111 0, #111 20px, #222 20px, #222 40px);opacity:0.3;transform:rotateX(60deg) scaleY(2)"></div>
        <div style="position:relative;z-index:2;width:120px;height:120px;background:var(--green-dim);border:2px solid var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;box-shadow:0 0 20px var(--green)" onclick="showToast('비어있는 CNC 3호기 선택됨')"><div style="font-size:40px">⚙️</div><div style="font-weight:700;color:var(--green);font-size:11px">CNC 3호기 (Idle)</div></div>
      </div>
      <div class="card" style="margin:0;display:flex;flex-direction:column"><div class="card-title">선택된 설비에 지시 하달</div><div class="label">할당할 지시번호</div><input type="text" class="inp" value="WO-3D-NEW" disabled style="margin-bottom:16px"><button class="btn btn-green" style="padding:16px;font-size:16px" onclick="showToast('해당 3D 설비로 작업지시가 꽂혔습니다.')">클릭한 설비(CNC 3호기)에 지시 확정</button></div>
    </div>
