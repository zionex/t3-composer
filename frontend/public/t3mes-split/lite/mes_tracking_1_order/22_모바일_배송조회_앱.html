<!DOCTYPE html>
<meta charset="UTF-8">
<title>모바일 배송조회 앱</title>
<!-- T3MES UI Pattern · mes_tracking_1_order · TabPage #22: 모바일 배송조회 앱 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p21">
    <div class="sec-hdr"><div><h3>㉒ 모바일 전용 배송조회 앱 (Mobile Tracking)</h3><span class="tip">소비자가 스마트폰으로 배송조회 링크를 클릭했을 때 열리는 모바일 웹/앱 전용 UI 프레임입니다.</span></div></div>
    <div class="mobile-frame">
      <div style="padding:20px;background:var(--rose);color:#fff;text-align:center;font-weight:700;font-size:16px">배송 조회</div>
      <div style="padding:20px">
        <div style="font-size:18px;font-weight:700;margin-bottom:10px">오늘 오후 2~4시 도착 예정</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:20px">택배기사: 김스피드 (010-1111-2222)</div>
        <div class="timeline">
          <div class="tl-item done"><div class="tl-dot"></div><div style="font-weight:700">배송출발</div><div style="font-size:11px;color:var(--text2)">강남 서초대리점</div></div>
          <div class="tl-item active"><div class="tl-dot"></div><div style="font-weight:700;color:var(--rose)">배송중</div><div style="font-size:11px;color:var(--text2)">고객님 동네 도착</div></div>
          <div class="tl-item"><div class="tl-dot"></div><div style="color:var(--text3)">배송완료 예정</div></div>
        </div>
        <button class="btn btn-rose" style="width:100%;margin-top:30px;padding:14px">기사님께 메시지 남기기</button>
      </div>
    </div>
  </div>
