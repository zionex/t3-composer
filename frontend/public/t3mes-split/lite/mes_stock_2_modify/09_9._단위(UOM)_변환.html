<!DOCTYPE html>
<meta charset="UTF-8">
<title>9. 단위(UOM) 변환</title>
<!-- T3MES UI Pattern · mes_stock_2_modify · TabPage #9: 9. 단위(UOM) 변환 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p8">
  <div class="sec-hdr"><div><h3>⑨ 단위(UOM) 분할 및 병합 조정</h3><span class="tip">1 Pallet를 해체하여 40 Box로 만들거나, 낱개(EA)를 묶어 1 Box로 장부를 변환합니다.</span></div></div>
  <div class="grid2">
    <div class="card" style="border-top:3px solid var(--blue)">
      <div class="card-title">단위 분할 (Split Down)</div>
      <div class="flex-between" style="margin-bottom:12px"><span>대상: <b>생수 2L (Pallet)</b></span><span class="badge b-amber">현재: 5 PLT</span></div>
      <div class="flex-between" style="gap:10px;margin-bottom:16px"><input type="number" class="inp" value="1" style="width:60px"> PLT ➔ <b>40</b> BOX</div>
      <button class="btn btn-blue" style="width:100%">분할 실행</button>
    </div>
    <div class="card" style="border-top:3px solid var(--green)">
      <div class="card-title">단위 병합 (Pack Up)</div>
      <div class="flex-between" style="margin-bottom:12px"><span>대상: <b>마우스 (EA)</b></span><span class="badge b-amber">현재: 152 EA</span></div>
      <div class="flex-between" style="gap:10px;margin-bottom:16px"><input type="number" class="inp" value="100" style="width:60px"> EA ➔ <b>1</b> Master Box</div>
      <button class="btn btn-green" style="width:100%">병합 실행</button>
    </div>
  </div>
</div>
