<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Monitoring Dashboard (50 Types) - Massive Full Data</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;--surface3:#252a3d;
  --border:#2a3050;--border2:#3a4570;
  --text:#e8ecf4;--text2:#a0aabf;--text3:#5a6480;
  --green:#00d68f;--green-dim:#00d68f22;--red:#ff4d6d;--red-dim:#ff4d6d22;
  --amber:#ffb347;--amber-dim:#ffb34722;--blue:#4d9fff;--blue-dim:#4d9fff22;
  --cyan:#00e5ff;--cyan-dim:#00e5ff22;--purple:#9d72ff;--purple-dim:#9d72ff22;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --radius:8px;--radius-lg:12px;
}

body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;overflow-y:scroll}
.app{min-height:100vh;display:flex;flex-direction:column}

/* Tab Nav */
.tab-nav{display:flex;gap:4px;padding:12px 16px 0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) var(--surface)}
.tab-nav::-webkit-scrollbar{height:8px}
.tab-nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.tab-btn{flex-shrink:0;padding:10px 16px;border:none;background:transparent;color:var(--text2);font-size:13px;font-family:var(--sans);cursor:pointer;border-radius:var(--radius) var(--radius) 0 0;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab-btn:hover{background:var(--surface2);color:var(--text)}
.tab-num{display:inline-block;background:var(--surface3);color:var(--text3);font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:4px;font-weight:700}

/* Tab Colors */
.t-b.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}.t-b.active .tab-num{color:var(--blue);background:var(--blue-dim)}
.t-g.active{color:var(--green);border-bottom-color:var(--green);font-weight:700}.t-g.active .tab-num{color:var(--green);background:var(--green-dim)}
.t-a.active{color:var(--amber);border-bottom-color:var(--amber);font-weight:700}.t-a.active .tab-num{color:var(--amber);background:var(--amber-dim)}
.t-c.active{color:var(--cyan);border-bottom-color:var(--cyan);font-weight:700}.t-c.active .tab-num{color:var(--cyan);background:var(--cyan-dim)}
.t-p.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:700}.t-p.active .tab-num{color:var(--purple);background:var(--purple-dim)}

/* Panel & Card */
.panel{display:none;padding:20px;background:var(--surface2);flex:1;animation:fadeIn .2s}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;box-shadow:0 4px 6px rgba(0,0,0,0.1);position:relative}
.card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-hdr h3{font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.tip{font-size:12px;color:var(--text3);display:block;margin-top:4px}

/* Layouts */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.grid-dense{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

/* Tables */
.tbl-wrap{overflow-y:auto;max-height:550px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.tbl th{position:sticky;top:0;z-index:10;padding:12px;text-align:left;font-size:12px;color:var(--text2);background:var(--surface3);border-bottom:2px solid var(--border);font-weight:700;box-shadow:0 1px 0 var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.tbl tr:hover td{background:var(--surface3)}
.tbl td.num{text-align:right;font-family:var(--mono)}

/* Charts & Visuals */
.gauge-wrap{position:relative;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%), var(--surface3) 0);display:flex;align-items:center;justify-content:center;margin:0 auto}
.gauge-inner{width:90px;height:90px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}
.chart-box{height:200px;display:flex;align-items:flex-end;gap:4px;padding-top:10px;border-bottom:1px solid var(--border);position:relative}
.bar-v{flex:1;background:var(--c, var(--blue));border-radius:4px 4px 0 0;transition:height .3s, filter .2s;min-width:10px}
.bar-v:hover{filter:brightness(1.3)}
.bar-h-wrap{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-h{height:16px;background:var(--c, var(--blue));border-radius:4px;transition:width .3s}
.prog-bg{flex:1;background:var(--surface3);height:10px;border-radius:5px;overflow:hidden}
.prog-fill{height:100%;background:var(--c, var(--blue));transition:width .3s}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 8px var(--green);animation:pulse 1.5s infinite}

/* Utilities */
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;font-family:var(--mono)}
@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes blink{0%,100%{background-color:transparent}50%{background-color:var(--red-dim)}}
@keyframes scrollUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.blink-row{animation:blink 1s infinite}
.val{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--c, var(--text))}
</style>
<style>/* T3MES split — hide tab nav + no-flash panel activation */.tab-nav,#tab-nav{display:none !important;}.panel{visibility:hidden;}.panel.t3split-target{visibility:visible;}html.t3split-fallback .panel.active{visibility:visible;}</style>
</head>
<body>

<div class="app">
<div class="tab-nav" id="tab-nav"></div>
<div id="panels"></div>
</div>

<script>
// --- Configuration & Data ---
const tabNames = [
  "설비종합효율 (OEE)", "2D 레이아웃", "설비상태 타일", "UPH 추이", "WIP 바차트", "안돈 알람현황", "불량률 파이", "생산진척률", "SPC 실시간", "파라미터 트렌드",
  "리드타임 추적", "작업자 투입", "일일생산 요약", "3D 트윈 뷰", "알람 피드", "에너지 모니터", "결품 위험판", "비전 AI 뷰", "금형 수명", "교대조 비교",
  "Raw Data", "병목 히트맵", "PM 캘린더", "현장 환경", "물류 AGV", "스캔 로그", "다기능공 맵", "택트타임", "백플러시", "재작업 루프",
  "Scrap 추이", "지연 오더", "긴급 오더", "피로도 관리", "MTBF/MTTR", "수율 폭포수", "출하 대기", "외주 진척도", "파레토 차트", "전력 원단위",
  "불량유형", "투입/산출", "모바일 요약", "안전 CCTV", "Lot 추적", "Kanban 현황", "생산 원가", "Multi-Site", "회의용 뷰", "위젯 보드"
];

const rInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const rFloat = (min, max) => (Math.random() * (max - min) + min).toFixed(2);
const rStat = () => { const r=Math.random(); return r>0.9?['var(--red)','정지']:r>0.7?['var(--amber)','대기']:['var(--green)','가동']; };
const getEl = id => document.getElementById(id);

// --- Core Initialization ---
function initTabs() {
  const nav = getEl('tab-nav');
  const panelsContainer = getEl('panels');
  
  tabNames.forEach((name, i) => {
    // Nav Button
    let grp = Math.floor(i / 10);
    let cls = ['t-b', 't-c', 't-g', 't-a', 't-p'][grp] || 't-b';
    let btn = document.createElement('button');
    btn.className = `tab-btn ${cls} ${i===0?'active':''}`;
    btn.innerHTML = `${name} <span class="tab-num">${i+1}</span>`;
    btn.onclick = () => switchTab(i, btn);
    nav.appendChild(btn);

    // Panel HTML Skeleton
    let panel = document.createElement('div');
    panel.className = `panel ${i===0?'active':''}`;
    panel.id = `p${i}`;
    panel.innerHTML = `<div class="sec-hdr"><div><h3><span class="live-dot" style="margin-right:8px;display:${i%2===0?'inline-block':'none'}"></span>${i+1}. ${name} 모니터링</h3><span class="tip">실시간으로 갱신되는 ${name} 데이터입니다.</span></div></div><div id="v${i}"></div>`;
    panelsContainer.appendChild(panel);
  });

  // Render contents
  renderAllPanels();
  
  // Live update simulation for elements with class 'live-val'
  setInterval(() => {
    const active = document.querySelector('.panel.active');
    if(!active) return;
    active.querySelectorAll('.live-val').forEach(el => {
      let v = parseFloat(el.innerText.replace(/,/g,''));
      if(isNaN(v)) return;
      let diff = (Math.random() - 0.5) * (v * 0.05); // 5% fluctuation
      let next = v + diff;
      el.innerText = next % 1 !== 0 ? next.toFixed(1) : Math.floor(next).toLocaleString();
    });
  }, 1500);
}

function switchTab(i, btnEl) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  btnEl.classList.add('active');
  document.querySelectorAll('.panel').forEach((p, idx) => p.classList.toggle('active', idx===i));
}

// --- Render Generators ---
function renderAllPanels() {
  g0(); g1(); g2(); g3(); g4(); g5(); g6(); g7(); g8(); g9();
  g10(); g11(); g12(); g13(); g14(); g15(); g16(); g17(); g18(); g19();
  g20(); g21(); g22(); g23(); g24(); g25(); g26(); g27(); g28(); g29();
  g30(); g31(); g32(); g33(); g34(); g35(); g36(); g37(); g38(); g39();
  g40(); g41(); g42(); g43(); g44(); g45(); g46(); g47(); g48(); g49();
}

// Utility Templates
const tblTpl = (head, rows) => `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const cardTpl = (t, c) => `<div class="card"><div class="card-title">${t}</div>${c}</div>`;

function g0() { // OEE Gauges
  let h=''; ['설비종합효율<br>(Overall Equipment Effectiveness)','가동률<br>(Availability)','성능 효율<br>(Performance)','품질 수율<br>(Quality)'].forEach(t=>{
    let p = rInt(75, 98); let c = p>85?'var(--green)':p>75?'var(--amber)':'var(--red)';
    h+=`<div class="card" style="text-align:center"><div class="card-title" style="justify-content:center;font-size:13px;height:40px;text-align:center">${t}</div><div class="gauge-wrap" style="--c:${c};--p:${p}"><div class="gauge-inner"><span class="val live-val" style="--c:${c}">${p}</span><span style="font-size:11px;color:var(--text2)">%</span></div></div></div>`;
  }); getEl('v0').innerHTML = `<div class="grid4">${h}</div>`;
}

function g1() { // 2D Layout
  let h = `<div style="position:relative;width:100%;height:500px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;overflow:hidden;background-image:linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);background-size:20px 20px;">`;
  for(let i=1;i<=15;i++){
    let [c, s] = rStat(); let x=rInt(5,90); let y=rInt(5,85);
    h+=`<div style="position:absolute;left:${x}%;top:${y}%;width:60px;height:40px;background:${c}44;border:2px solid ${c};border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:${c};box-shadow:0 0 10px ${c}aa">EQ-${i}</div>`;
  }
  h+=`</div>`; getEl('v1').innerHTML = h;
}

function g2() { // Machine Tiles
  let h = `<div class="grid-dense">`;
  for(let i=1;i<=30;i++){
    let [c, s] = rStat();
    h+=`<div class="card" style="margin:0;border-left:4px solid ${c};display:flex;flex-direction:column;gap:8px"><div style="font-weight:700">CNC M/C #${i}</div><div style="font-size:11px;color:${c}">${s}</div><div class="val live-val" style="font-size:16px">${rInt(100,5000)}</div><div style="font-size:10px;color:var(--text3)">생산량</div></div>`;
  }
  getEl('v2').innerHTML = h + `</div>`;
}

function g3() { // UPH Trend SVG
  let pts=''; for(let i=0;i<24;i++){ pts+=`${i*40},${180 - rInt(20,150)} `; }
  getEl('v3').innerHTML = cardTpl('24시간 UPH (Unit Per Hour) 추이', `<div style="height:250px;width:100%;background:var(--surface3);border-radius:8px;position:relative"><svg width="100%" height="100%" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--cyan)" stroke-width="3" vector-effect="non-scaling-stroke"/></svg></div>`);
}

function g4() { // WIP Bar Chart
  let h=''; for(let i=1;i<=12;i++){ h+=`<div class="bar-v" style="height:${rInt(10,90)}%;--c:var(--blue)" title="공정 ${i}"></div>`; }
  getEl('v4').innerHTML = cardTpl('공정별 재공품(WIP) 체류 현황', `<div class="chart-box" style="gap:8px">${h}</div><div style="display:flex;justify-content:space-between;margin-top:8px;color:var(--text2);font-size:10px"><span>투입</span><span>검사</span><span>출하</span></div>`);
}

function g5() { // Andon
  let rows=[]; for(let i=1;i<=20;i++){
    let isRed = i%4===0; let c = isRed ? 'var(--red)' : 'var(--text)';
    rows.push(`<tr class="${isRed?'blink-row':''}"><td>${i}</td><td style="color:${c};font-weight:700">${isRed?'🚨 설비고장':'자재호출'}</td><td>라인 ${rInt(1,5)}</td><td>${rInt(1,50)}분 전</td></tr>`);
  }
  getEl('v5').innerHTML = tblTpl(['No','호출유형','위치','경과시간'], rows);
}

function g6() { // Defect Pie
  getEl('v6').innerHTML = `<div class="grid3">
    ${cardTpl('라인 A 불량유형', `<div class="gauge-wrap" style="background:conic-gradient(var(--red) 30%, var(--amber) 30% 60%, var(--purple) 60%);width:150px;height:150px"></div><div style="text-align:center;margin-top:16px">치수 30% / 외관 30% / 조립 40%</div>`)}
    ${cardTpl('라인 B 불량유형', `<div class="gauge-wrap" style="background:conic-gradient(var(--red) 50%, var(--amber) 50% 80%, var(--purple) 80%);width:150px;height:150px"></div><div style="text-align:center;margin-top:16px">치수 50% / 외관 30% / 조립 20%</div>`)}
    ${cardTpl('총 불량률', `<div class="val live-val" style="--c:var(--red);text-align:center;font-size:40px;line-height:150px">2.4%</div>`)}
  </div>`;
}

function g7() { // Progress
  let rows=[]; for(let i=1;i<=30;i++){
    let p=rInt(10,100); let c = p===100?'var(--green)':'var(--blue)';
    rows.push(`<tr><td style="font-family:var(--mono)">WO-P-${i}</td><td><div class="prog-bg"><div class="prog-fill" style="width:${p}%;--c:${c}"></div></div></td><td class="num">${p}%</td></tr>`);
  }
  getEl('v7').innerHTML = tblTpl(['작업지시','진척도','달성률'], rows);
}

function g8() { // SPC
  let pts=''; for(let i=0;i<50;i++){ pts+=`${i*20},${rInt(40,60)} `; }
  getEl('v8').innerHTML = cardTpl('실시간 X-bar Chart (Ø50.0)', `<div style="height:300px;background:var(--surface3);position:relative;border:1px solid var(--border)"><div style="position:absolute;top:20%;width:100%;border-top:1px dashed var(--red)"></div><div style="position:absolute;top:50%;width:100%;border-top:1px solid var(--cyan)"></div><div style="position:absolute;top:80%;width:100%;border-top:1px dashed var(--red)"></div><svg width="100%" height="100%" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="2"/></svg></div>`);
}

function g9() { // Param Trend
  let rows=[]; for(let i=1;i<=15;i++) rows.push(`<tr><td>Furnace ${i}호</td><td class="num live-val">${rInt(200,300)}</td><td class="num live-val">${rFloat(4,5)}</td></tr>`);
  getEl('v9').innerHTML = `<div class="grid2">${cardTpl('실시간 설비 파라미터', tblTpl(['설비','온도(℃)','압력(MPa)'], rows))}${cardTpl('Trend 추이', '<div style="height:100%;background:var(--surface3);display:flex;align-items:center;justify-content:center;color:var(--text3)">다중 라인 차트 영역</div>')}</div>`;
}

function g10() { // Gantt / Lead Time
  let h=''; for(let i=1;i<=10;i++){
    let l=rInt(0,50); let w=rInt(10,40);
    h+=`<div class="bar-h-wrap"><div style="width:100px;font-size:11px">LOT-${i}</div><div style="flex:1;background:var(--surface3);height:16px;border-radius:4px;position:relative"><div style="position:absolute;left:${l}%;width:${w}%;height:100%;background:var(--purple);border-radius:4px"></div></div></div>`;
  }
  getEl('v10').innerHTML = cardTpl('공정별 리드타임 추적 (Gantt)', h);
}

function g11() { // Skill Worker
  let rows=[]; for(let i=1;i<=20;i++){
    let sk = ['A','B','C'][i%3]; let c = sk==='A'?'var(--green)':sk==='B'?'var(--blue)':'var(--amber)';
    rows.push(`<tr><td>작업자 ${i}</td><td><span class="badge" style="background:${c}22;color:${c}">등급 ${sk}</span></td><td>공정 ${rInt(1,5)}</td></tr>`);
  }
  getEl('v11').innerHTML = `<div class="grid2">${cardTpl('라인 투입 현황', tblTpl(['이름','스킬등급','투입위치'],rows))}${cardTpl('요약','<div style="font-size:30px;text-align:center;padding:50px 0">총 투입: 20명<br><span style="color:var(--green);font-size:20px">A등급 보유: 7명</span></div>')}</div>`;
}

function g12() { // Summary
  getEl('v12').innerHTML = `<div class="grid4" style="margin-bottom:16px">
    ${cardTpl('총 생산량', '<div class="val live-val" style="--c:var(--blue)">12,450</div>')}
    ${cardTpl('목표 달성률', '<div class="val live-val" style="--c:var(--green)">94.2%</div>')}
    ${cardTpl('총 불량건수', '<div class="val live-val" style="--c:var(--red)">312</div>')}
    ${cardTpl('가동 설비수', '<div class="val" style="--c:var(--amber)">28 / 30</div>')}
  </div>` + tblTpl(['시간대','목표','실적','불량'], [1,2,3,4,5].map(i=>`<tr><td>0${i}:00</td><td class="num">1000</td><td class="num">${rInt(800,1000)}</td><td class="num" style="color:var(--red)">${rInt(0,20)}</td></tr>`));
}

function g13() { // 3D Twin (CSS Simulated)
  getEl('v13').innerHTML = `<div style="height:500px;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
    <div style="position:absolute;width:200%;height:200%;background:repeating-linear-gradient(45deg, #111 0, #111 20px, #222 20px, #222 40px);transform:rotateX(60deg) scaleY(2);opacity:0.5"></div>
    <div class="grid3" style="position:relative;z-index:2;gap:40px;transform:translateY(-20px)">

<script>/* T3MES split — auto-activate TabPage #26 (no-flash) */
(function(){var I=26,done=false;
function activate(){
  var panels=document.querySelectorAll(".panel");
  if(!panels.length)return false;
  var btns=document.querySelectorAll(".tab-btn");
  var btn=btns[I]||null;
  if(typeof switchTab==="function"){try{switchTab(I,btn);}catch(e){}}
  panels.forEach(function(p,idx){
    p.classList.toggle("active",idx===I);
    p.classList.toggle("t3split-target",idx===I);
  });
  btns.forEach(function(b,idx){b.classList.toggle("active",idx===I);});
  done=true;return true;
}
function tick(){if(done)return;try{activate();}catch(e){}}
if(document.readyState!=="loading")tick();
document.addEventListener("DOMContentLoaded",tick);
window.addEventListener("load",function(){
  tick();setTimeout(tick,60);setTimeout(tick,200);setTimeout(tick,500);
});
setTimeout(function(){
  if(!done)document.documentElement.classList.add("t3split-fallback");
},1500);
})();
</script>
