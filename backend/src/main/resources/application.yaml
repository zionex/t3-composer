# T3Composer 단독 백엔드 — 공통 설정
spring:
  application:
    name: t3-composer-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:11433;databaseName=T3SMARTSCM;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:Composer!2026}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none      # init SQL 들이 모두 책임. JPA 가 ALTER 하지 못하게.
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${COMPOSER_BACKEND_PORT:8090}
  servlet:
    context-path: /
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Composer 전용 설정 (ApplicationProperties.Composer 와 동일 구조)
app:
  composer:
    auto-apply-enabled: true
    apply-mode: ${COMPOSER_APPLY_MODE:staging}
    project-root: ${COMPOSER_PROJECT_ROOT:/workspace/staging}
    wingui-ref-path: ${COMPOSER_WINGUI_REF_PATH:/workspace/wingui}
    database-ref-path: ${COMPOSER_DATABASE_REF_PATH:/workspace/database}
    upgrade-version: ${COMPOSER_UPGRADE_VERSION:v26.0.0-20260507}
    allow-write-patterns:
      - "**/view/**"
      - "**/data/menus.js"
      - "**/data/menus.js.patch"
      - "**/main/java/**"
      - "**/mssql/procedures/**"
      - "**/mssql/upgrade/**"
      - "**/oracle/procedures/**"
      - "**/oracle/upgrade/**"

# Anthropic API key — 우선순위: 1) DB 의 TB_IS_EXTRNLAPIKEY  2) 이 환경변수
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

logging:
  level:
    root: INFO
    com.zionex.t3composer: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
