# T3Composer 단독 환경 — 3 서비스 (db / backend / frontend)
# 사용법: cp .env.example .env → 값 채운 후 `docker compose up -d`

services:
  # ---------------------------------------------------------------
  # 1. PostgreSQL 17 — Composer 운영 데이터 DB (2026-05-11 PG 전환)
  #    Composer 자체의 세션·메시지·아티팩트·패턴·사전을 보관.
  #    Target System (T3SERIES_MSSQL 등) 의 SP 산출물은 Target 의 DB 방언
  #    그대로 생성되며 이 DB 에 직접 실행되지 않음 (apply 는 dialect 분기 — Phase 4).
  # ---------------------------------------------------------------
  composer-db:
    image: postgres:17-alpine
    container_name: composer-db
    environment:
      POSTGRES_USER: ${COMPOSER_DB_USER:-composer}
      POSTGRES_PASSWORD: ${COMPOSER_DB_PASSWORD:-Composer!2026}
      POSTGRES_DB: ${COMPOSER_DB_NAME:-t3composer}
      # search_path 는 init 의 00_setup_schema.sql 이 DB-level 로 설정
    ports:
      - "${COMPOSER_DB_PORT:-15432}:5432"
    volumes:
      - composer-db-data:/var/lib/postgresql/data
    networks:
      - composer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPOSER_DB_USER:-composer} -d ${COMPOSER_DB_NAME:-t3composer}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------
  # 2. DB Init — composer-db (PG) 에 init-pg/*.sql 적용
  #    멱등: t3composer_init_done 테이블 존재 여부로 판단
  # ---------------------------------------------------------------
  composer-db-init:
    image: postgres:17-alpine
    container_name: composer-db-init
    depends_on:
      composer-db:
        condition: service_healthy
    environment:
      PGUSER: ${COMPOSER_DB_USER:-composer}
      PGPASSWORD: ${COMPOSER_DB_PASSWORD:-Composer!2026}
      PGHOST: composer-db
      PGPORT: "5432"
      PGDATABASE: ${COMPOSER_DB_NAME:-t3composer}
    volumes:
      - ./docker/db/init-pg:/init:ro
    networks:
      - composer-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "[init] Waiting for composer-db ..."
        for i in $$(seq 1 30); do
          psql -c "SELECT 1" > /dev/null 2>&1 && break
          sleep 2
        done

        # =================================================================
        # Phase 1 — Baseline (one-shot, 멱등 마커로 보호)
        #   00-99 *.sql = 테이블 생성·초기 시드·data 재구성. DROP TABLE / PK
        #   rename 등 재실행 시 파괴적 SQL 포함. 마커가 없을 때만 실행.
        # =================================================================
        EXISTS=$$(psql -tA -c "SELECT CASE WHEN EXISTS(SELECT 1 FROM pg_class WHERE relname='t3composer_init_done') THEN 1 ELSE 0 END" 2>/dev/null | tr -d '[:space:]')
        if [ "$$EXISTS" = "0" ]; then
          echo "[init] Phase 1: Running baseline (00-99) ..."
          for f in /init/00_*.sql /init/0[2-9]_*.sql /init/[1-9][0-9]_*.sql; do
            [ -f "$$f" ] || continue
            echo "[init]   $$f"
            psql -v ON_ERROR_STOP=1 -f "$$f"
            if [ $$? -ne 0 ]; then
              echo "[init] FAILED at $$f"
              exit 1
            fi
          done
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS t3composer_init_done (created timestamp DEFAULT now()); INSERT INTO t3composer_init_done DEFAULT VALUES;"
          echo "[init] Phase 1: Baseline marker set."
        else
          echo "[init] Phase 1: Baseline marker exists. SKIP."
        fi

        # =================================================================
        # Phase 2 — always/*.sql (매 docker compose up 마다 실행)
        #   기존 볼륨이 새 ALTER 마이그레이션을 자동 흡수하기 위한 통로.
        #   모두 멱등이어야 함 (IF NOT EXISTS · ON CONFLICT · IF EXISTS guard).
        #   파괴적 SQL (DROP TABLE, PK rename 등) 절대 금지.
        #   상세 규약: docker/db/init-pg/always/README.md
        # =================================================================
        echo "[init] Phase 2: Running always/ migrations ..."
        for f in /init/always/*.sql; do
          [ -f "$$f" ] || continue
          echo "[init]   $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
          if [ $$? -ne 0 ]; then
            echo "[init] FAILED at $$f"
            exit 1
          fi
        done

        echo "[init] DONE"
    restart: "no"

  # ---------------------------------------------------------------
  # 2a. Target Operational DB — MSSQL (T3SERIES/PLANNEL/LGES_NEXTSCM 공유)
  #     화면 실행 (preview/apply) 시 LLM 산출 SP DDL 을 여기 적용.
  #     composer-db (PG) 와 분리 — composer 메타 ↔ Target 방언 산출물 격리.
  # ---------------------------------------------------------------
  target-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: target-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${TARGET_MSSQL_PASSWORD:-Composer!2026}
      MSSQL_PID: Developer
    ports:
      - "${TARGET_MSSQL_PORT:-11433}:1433"
    volumes:
      - target-mssql-data:/var/opt/mssql
    networks:
      - composer-net
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -h -1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Target MSSQL 의 DB 생성 + wingui minimal DDL/seed 적용
  # composer 자체 메타 (TB_IS_COMPOSER_*) 은 PG 만. wingui 마스터 (TB_AD_*, TB_UT_*) 는 MSSQL.
  target-mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: target-mssql-init
    depends_on:
      target-mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${TARGET_MSSQL_PASSWORD:-Composer!2026}
      TARGET_DB_NAME: ${TARGET_DB_NAME:-T3SMARTSCM}
    volumes:
      - ./docker/db/init:/init:ro
    networks:
      - composer-net
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S target-mssql -U sa -P $$MSSQL_SA_PASSWORD -C"
        echo "[target-init] Waiting for target-mssql ..."
        for i in $$(seq 1 30); do
          $$SQLCMD -Q "SELECT 1" -b -h -1 > /dev/null 2>&1 && break
          sleep 2
        done

        # Step 1 — DB 생성 (master 에서)
        echo "[target-init] /init/01_create_database.sql"
        $$SQLCMD -d master -i /init/01_create_database.sql -b

        # Step 2 — 마커 체크. 있으면 skip.
        EXISTS=$$($$SQLCMD -d $$TARGET_DB_NAME -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN EXISTS(SELECT 1 FROM sys.tables WHERE name='TARGET_INIT_DONE') THEN 1 ELSE 0 END" 2>/dev/null | head -1 | tr -d '[:space:]')
        if [ "$$EXISTS" = "1" ]; then
          echo "[target-init] TARGET_INIT_DONE marker exists. SKIP."
          exit 0
        fi

        # Step 3 — wingui minimal (02, 03) 만 적용 — composer 자체 init (04~12) 는 PG 만.
        for f in /init/02_wingui_minimal_ddl.sql /init/03_wingui_seed_menus_users.sql; do
          echo "[target-init]   $$f"
          $$SQLCMD -d $$TARGET_DB_NAME -i "$$f" -b
        done

        # Marker
        $$SQLCMD -d $$TARGET_DB_NAME -Q "CREATE TABLE TARGET_INIT_DONE (created DATETIME DEFAULT GETDATE()); INSERT INTO TARGET_INIT_DONE DEFAULT VALUES;" -b
        echo "[target-init] DONE"
    restart: "no"

  # ---------------------------------------------------------------
  # 3. Spring Boot 백엔드 (Phase 3 에서 활성화)
  # ---------------------------------------------------------------
  composer-backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: composer-backend
    depends_on:
      composer-db-init:
        condition: service_completed_successfully
      target-mssql-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${COMPOSER_PROFILE:-dev}
      # Primary DataSource — Composer 자체 메타 DB (PG)
      SPRING_DATASOURCE_URL: jdbc:postgresql://composer-db:5432/${COMPOSER_DB_NAME:-t3composer}?currentSchema=dbo,public
      SPRING_DATASOURCE_USERNAME: ${COMPOSER_DB_USER:-composer}
      SPRING_DATASOURCE_PASSWORD: ${COMPOSER_DB_PASSWORD:-Composer!2026}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      # Secondary DataSource — Target operational DB (MSSQL).
      # SP/DDL 산출물이 여기로 실행됨.
      TARGET_DATASOURCE_URL: jdbc:sqlserver://target-mssql:1433;databaseName=${TARGET_DB_NAME:-T3SMARTSCM};encrypt=true;trustServerCertificate=true
      TARGET_DATASOURCE_USERNAME: sa
      TARGET_DATASOURCE_PASSWORD: ${TARGET_MSSQL_PASSWORD:-Composer!2026}
      TARGET_DATASOURCE_DRIVER_CLASS_NAME: com.microsoft.sqlserver.jdbc.SQLServerDriver
      # Per-Target System 운영 DB 접속 정보 — 비어있으면 startup 시 update 안 함
      # (이미 DB 에 저장된 값 유지). Target=T3SERIES 의 db_url/계정을 외부 (운영/개발 DB) 로
      # 라우팅하고 싶을 때 .env 에 설정.
      TARGET_T3SERIES_DB_URL:           ${TARGET_T3SERIES_DB_URL:-}
      TARGET_T3SERIES_DB_USERNAME:      ${TARGET_T3SERIES_DB_USERNAME:-}
      TARGET_T3SERIES_DB_PASSWORD:      ${TARGET_T3SERIES_DB_PASSWORD:-}
      TARGET_T3SERIES_DB_DRIVER_CLASS:  ${TARGET_T3SERIES_DB_DRIVER_CLASS:-com.microsoft.sqlserver.jdbc.SQLServerDriver}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      COMPOSER_APPLY_MODE: ${COMPOSER_APPLY_MODE:-staging}
      COMPOSER_PROJECT_ROOT: /workspace/staging
      COMPOSER_UPGRADE_VERSION: ${COMPOSER_UPGRADE_VERSION:-v26.0.0-20260507}
      COMPOSER_PREVIEW_FRONTEND_ROOT: /workspace/preview/frontend
      COMPOSER_PREVIEW_JAVA_ROOT: /app/src/main/java/com/zionex/t3composer/preview
      COMPOSER_PREVIEW_MVN_WORKDIR: /app
      # 거버넌스 스냅샷/복원 — repo 루트 (아래 ./:/workspace/repo:rw 마운트와 매칭)
      COMPOSER_REPO_ROOT: /workspace/repo
      # 스냅샷 시크릿(.env 의 API키·비밀번호, db_password) 암호화 마스터키.
      # 비어있으면 .env 캡처/복원 시 명확한 오류. 분실 시 기존 스냅샷 시크릿 복호화 불가 — 별도 백업 필수.
      COMPOSER_SNAPSHOT_SECRET_KEY: ${COMPOSER_SNAPSHOT_SECRET_KEY:-}
      # LLM 백엔드 토글 (2026-06-02 추가)
      # api (기본): Anthropic HTTP API · cli: 호스트 ~/.claude 로그인 + claude CLI subprocess
      LLM_BACKEND: ${LLM_BACKEND:-api}
      LLM_CLI_BINARY: ${LLM_CLI_BINARY:-/usr/bin/claude}
      LLM_CLI_TIMEOUT_MIN: ${LLM_CLI_TIMEOUT_MIN:-40}
      LLM_CLI_MAX_CONCURRENT: ${LLM_CLI_MAX_CONCURRENT:-4}
      # insight-llm 서버 주소 — InsightWebFluxController 가 /insight/sse/** 를 여기로 프록시.
      # 컨테이너 안 'localhost' 는 자기 자신을 가리키므로 호스트 9160 을 잡으려면 host.docker.internal 필수.
      INSIGHT_LLM_BASE_URL: ${INSIGHT_LLM_BASE_URL:-http://host.docker.internal:9160}
    ports:
      - "${COMPOSER_BACKEND_PORT:-8090}:8090"
    volumes:
      # Phase 1 — DevTools 핫리로드용. host 의 backend 코드가 컨테이너에 보이게.
      - ./backend:/app
      - composer-maven-repo:/root/.m2
      - ./staging:/workspace/staging
      # Phase 2a — JSX preview 산출물을 frontend webpack-dev-server 가 watch 하는 위치에 직접 작성.
      - ./frontend/src/view/_preview:/workspace/preview/frontend
      # Target System 별 wingui / database 폴더 슬롯 — 호스트 드라이브가 달라도 (C: / D:) 독립 마운트.
      # (2026-05-28) 글로벌 /workspace/wingui · /workspace/database 마운트 폐기 — Per-Target 만 사용.
      # 미설정 슬롯은 ./empty (빈 폴더) 마운트로 처리 (compose 가 빈 source 거부).
      # Target.wingui_ref_path 에 컨테이너 안 경로를 저장하면 그게 우선 사용되고,
      # 비어있으면 fallback 으로 /workspace/targets/<CD>/{wingui|database} 사용.
      # (2026-05-27) wingui 마운트는 RW — ArtifactApplyService 가 staging 우회하고
      #   Target wingui 에 산출물 직접 쓰기 (Java 는 패키지 자동 rename).
      - ${TARGET_T3SERIES_PATH:-./empty}:/workspace/targets/T3SERIES/wingui:rw
      # PLANEL 의 source 마운트는 RW — 메뉴 등록 시 backend 가 src/pages/TabMenuList.js 를
      # 직접 갱신해야 함 (PLANEL 의 메뉴 진실 소스가 JS 파일, menu_source='JS_FILE').
      - ${TARGET_PLANNEL_PATH:-./empty}:/workspace/targets/PLANNEL/wingui:rw
      # PLANEL 은 frontend(saas-web) 와 backend(saas-application) 가 별도 디렉토리.
      # EXISTING_MODIFY 모드의 InsightSourceController 가 Controller/Service/Repository .java 를
      # 찾으려면 backend root 가 별도 마운트로 컨테이너에 보여야 함.
      # tb_cmp_target_system.backend_ref_path = '/workspace/targets/PLANNEL/backend' 매칭.
      - ${TARGET_PLANNEL_BACKEND_PATH:-./empty}:/workspace/targets/PLANNEL/backend:rw
      - ${TARGET_LGES_NEXTSCM_PATH:-./empty}:/workspace/targets/LGES_NEXTSCM/wingui:rw
      # (2026-06-08) Per-Target 프로젝트 루트 슬롯 (RO) — 소스 디렉토리(wingui) 보다 한 단계 위인
      # 프로젝트 루트 자산 접근용. 대표 용도: .insight_code/ontology_v2 (Ontology Tab 의 base 데이터).
      # T3SERIES 처럼 nested monorepo (project_root/t3series-wingui/packages/wingui/src) 에서
      # wingui 마운트는 source 만 보고, project root 는 별도 마운트로 노출.
      # 미설정 시 TARGET_<CD>_PATH 에 폴백 (= wingui 와 project root 가 같은 평탄 구조 Target).
      - ${TARGET_T3SERIES_PROJECT_PATH:-${TARGET_T3SERIES_PATH:-./empty}}:/workspace/targets/T3SERIES/project:ro
      - ${TARGET_PLANNEL_PROJECT_PATH:-${TARGET_PLANNEL_PATH:-./empty}}:/workspace/targets/PLANNEL/project:ro
      - ${TARGET_LGES_NEXTSCM_PROJECT_PATH:-${TARGET_LGES_NEXTSCM_PATH:-./empty}}:/workspace/targets/LGES_NEXTSCM/project:ro
      # (2026-06-04) Workspace 부모 폴더 — UI 의 [📁 Source 등록] 다이얼로그가 폴더 탐색 시
      # 이 마운트의 sub-path 만 선택 가능. backend 는 컨테이너 안 경로
      # /workspace/projects/<repo>/... 형태로 Target source_ref_path / backend_ref_path 에 저장.
      # 사용자 호스트의 ~/work/projects 하위 모든 SCM repo 가 한 번에 노출 — 다른 드라이브
      # repo 는 못 등록 (필요 시 COMPOSER_WORKSPACE_ROOT 변경).
      - ${COMPOSER_WORKSPACE_ROOT:-${HOME}/work/projects}:/workspace/projects:rw
      # Claude assets — 공용 + Target overlay 2단 구조 (2026-06 재구조화).
      #   .claude/                        = 공용 rules + hooks (Composer 본체, 모든 Target)
      #   .claude/targets/t3series/       = T3SERIES 전용 overlay (TB_AD_MENU·SP_UI_·온톨로지)
      #   .claude/targets/plannel/        = PLANNEL  전용 overlay (TabMenuList·PostgreSQL·AG-Grid)
      # ImportService.importFromClaudeFolders(targetCd, [common, target]) 가 2단 import —
      # common 먼저 → target overlay 가 같은 ruleCode 면 덮어쓰기 (rule_version+1).
      # 부모 source repo 의 .claude 를 직접 가리키려면 .env 의 OVERLAY 환경변수 변경.
      # 변수명 주의: 기존 COMPOSER_T3SERIES_CLAUDE_PATH / COMPOSER_PLANNEL_CLAUDE_PATH 는
      # 2026-06 재구조화로 더 이상 사용 안 함 (옛 평탄 폴더 가리키므로). 새 이름 OVERLAY_PATH 사용.
      - ./.claude:/workspace/common-claude:ro
      - ${COMPOSER_T3SERIES_OVERLAY_PATH:-./.claude/targets/t3series}:/workspace/t3series-claude:ro
      - ${COMPOSER_PLANNEL_OVERLAY_PATH:-./.claude/targets/plannel}:/workspace/plannel-claude:ro
      - ${COMPOSER_LGES_NEXTSCM_OVERLAY_PATH:-./.claude/targets/lges_nextscm}:/workspace/lges_nextscm-claude:ro
      # 거버넌스 스냅샷/복원 (rw) — 백엔드가 repo 루트의 .claude/·.env·CLAUDE.md·docs/ 를
      # 직접 read/write. repo 루트 통째 마운트 — .env 단일파일 마운트의 inode 끊김 회피.
      # 노출만 될 뿐 backend/·frontend/·staging/·.git/ 등은 excludeGlobs 가 절대 touch 안 함.
      - ./:/workspace/repo:rw
      # LLM CLI 모드용 — 호스트 ~/.claude 로그인 정보 (OAuth 토큰) 컨테이너에 노출.
      # rw 인 이유: claude CLI 가 토큰 refresh 결과를 호스트에 다시 써 동기화.
      # 호스트에 ~/.claude 가 없으면 docker 가 빈 디렉토리 자동 생성 — LLM_BACKEND=api 시 무해.
      - ${HOME}/.claude:/root/.claude:rw
    networks:
      - composer-net
    # 호스트(Windows)에서 직접 실행 중인 insight-llm :9160 등에 컨테이너에서 접근 — host.docker.internal 명시.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s   # mvn 첫 컴파일 + dependency resolve 시간 확보
    restart: unless-stopped

  # ---------------------------------------------------------------
  # 4. React 프론트 (Phase 4 에서 활성화)
  # ---------------------------------------------------------------
  composer-frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: composer-frontend
    depends_on:
      - composer-backend
    environment:
      COMPOSER_API_BASE: http://composer-backend:8090
      WDS_PORT: 5173
      # insight 서버 주소 (webpack.config.js 가 빌드 시 주입).
      # 기본값(http://localhost:9160) 은 현재 dev 동작 유지. .env 에서 override 가능.
      INSIGHT_API_BASE: ${INSIGHT_API_BASE:-http://localhost:9160}
    ports:
      - "${COMPOSER_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # frontend 빌드용 wingui-core / RealGrid2 alias 원본 — entrypoint.sh 가 realgrid 자동 복사.
      # (2026-05-28) COMPOSER_WINGUI_REF_PATH 폐기 — TARGET_T3SERIES_PATH 재사용 (T3SERIES 가
      # 표준 wingui 모노레포 = packages/wingui/realgrid 보유). PLANNEL/기타 Target 만 쓰는 사용자는
      # TARGET_T3SERIES_PATH 에 wingui 모노레포 경로 1개만 설정하면 됨.
      - ${TARGET_T3SERIES_PATH:-../t3series/t3series-wingui}:/workspace/wingui:ro
      # Target System 별 source 폴더 슬롯 (backend 와 동일 패턴) — frontend 도 source bundle 조회 등에 사용
      - ${TARGET_T3SERIES_PATH:-./empty}:/workspace/targets/T3SERIES/wingui:ro
      - ${TARGET_PLANNEL_PATH:-./empty}:/workspace/targets/PLANNEL/wingui:ro
      - ${TARGET_LGES_NEXTSCM_PATH:-./empty}:/workspace/targets/LGES_NEXTSCM/wingui:ro
      # Per-Target 프로젝트 루트 슬롯 (RO) — backend 와 동일 (§composer-backend).
      - ${TARGET_T3SERIES_PROJECT_PATH:-${TARGET_T3SERIES_PATH:-./empty}}:/workspace/targets/T3SERIES/project:ro
      - ${TARGET_PLANNEL_PROJECT_PATH:-${TARGET_PLANNEL_PATH:-./empty}}:/workspace/targets/PLANNEL/project:ro
      - ${TARGET_LGES_NEXTSCM_PROJECT_PATH:-${TARGET_LGES_NEXTSCM_PATH:-./empty}}:/workspace/targets/LGES_NEXTSCM/project:ro
    networks:
      - composer-net
    restart: unless-stopped

networks:
  composer-net:
    driver: bridge

volumes:
  composer-db-data:
    driver: local
  target-mssql-data:
    driver: local
  composer-maven-repo:
    driver: local
