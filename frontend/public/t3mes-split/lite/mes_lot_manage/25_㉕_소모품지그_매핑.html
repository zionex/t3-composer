<!DOCTYPE html>
<meta charset="UTF-8">
<title>㉕ 소모품/지그 매핑</title>
<!-- T3MES UI Pattern · mes_lot_manage · TabPage #25: ㉕ 소모품/지그 매핑 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<!-- 이 TabPage 는 원본 스크립트가 동적 생성합니다. 아래는 panel innerHTML 템플릿 -->
<div class="panel active" id="p24">

    <div class="sec-hdr"><div><h3>㉕ LOT Hold (보류 / 잠금)</h3><span class="tip">수율 저하, 레시피 오류 의심 등으로 진행 중인 LOT를 강제로 멈춰 세웁니다(Hold). (100건)</span></div></div>
    <div class="grid2">
      <div class="card"><div class="card-title">진행중인 LOT 리스트</div>${buildTable(['선택','LOT_NO','현재공정','수량','상태'], p24_rows, '400px')}</div>
      <div class="card" style="border-color:var(--red);background:var(--surface2)"><div class="card-title" style="color:var(--red)">Hold (보류) 설정</div><div class="label">Hold 사유 코드</div><select class="inp" style="margin-bottom:16px"><option>ENG-01: 엔지니어 확인 필요</option><option>QC-02: 수율 저하 의심</option><option>OOS: 설비 Out of Spec</option></select><div class="label">상세 코멘트</div><textarea class="inp" rows="4" style="margin-bottom:20px">CD(선폭) 측정값 이상 발생으로 인한 일시 보류</textarea><button class="btn btn-red" style="width:100%;padding:16px;font-size:16px" onclick="showToast('선택된 LOT들이 Hold 처리되었습니다.')">Hold (잠금) 실행 🔒</button></div>
    </div>
</div>
