# T3Composer 단독 백엔드 — 공통 설정
spring:
  application:
    name: t3-composer-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 2026-05-11: Composer 자체 운영 DB 가 PostgreSQL 로 전환.
  # Target System (T3SERIES_MSSQL 등) 의 산출물은 Target dialect 그대로 생성됨.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/t3composer?currentSchema=dbo,public}
    username: ${SPRING_DATASOURCE_USERNAME:composer}
    password: ${SPRING_DATASOURCE_PASSWORD:Composer!2026}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    database-platform: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: none      # init SQL 들이 모두 책임. JPA 가 ALTER 하지 못하게.
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    # Anthropic 호출 (Mono 반환 controller) 가 async 처리되며 이 timeout 에 종속.
    # AnthropicClient 의 responseTimeout(40분) 보다 같거나 약간 길게.
    async:
      request-timeout: 2700000   # 45분 (밀리초)

# Target Operational DataSource — 화면 실행 시 LLM 산출 SP/DDL 적용 대상.
# composer-db (PG) 와 별개 — Target System 의 dialect 와 일치하는 DB.
target:
  datasource:
    url: ${TARGET_DATASOURCE_URL:jdbc:sqlserver://localhost:11433;databaseName=T3SMARTSCM;encrypt=true;trustServerCertificate=true}
    username: ${TARGET_DATASOURCE_USERNAME:sa}
    password: ${TARGET_DATASOURCE_PASSWORD:Composer!2026}
    driver-class-name: ${TARGET_DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}
  # Per-Target DB 접속 정보 seed — startup 시 tb_cmp_target_system 의 db_url 등을 갱신.
  # 값이 비어있으면 DB 의 기존 값 유지. .env 의 TARGET_<CD>_DB_* 와 1:1 매칭.
  seed:
    t3series:
      db-url:            ${TARGET_T3SERIES_DB_URL:}
      db-username:       ${TARGET_T3SERIES_DB_USERNAME:}
      db-password:       ${TARGET_T3SERIES_DB_PASSWORD:}
      db-driver-class:   ${TARGET_T3SERIES_DB_DRIVER_CLASS:}

server:
  port: ${COMPOSER_BACKEND_PORT:8090}
  servlet:
    context-path: /
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Composer 전용 설정 (ApplicationProperties.Composer 와 동일 구조)
app:
  composer:
    auto-apply-enabled: true
    apply-mode: ${COMPOSER_APPLY_MODE:staging}
    project-root: ${COMPOSER_PROJECT_ROOT:/workspace/staging}
    wingui-ref-path: ${COMPOSER_WINGUI_REF_PATH:/workspace/wingui}
    database-ref-path: ${COMPOSER_DATABASE_REF_PATH:/workspace/database}
    upgrade-version: ${COMPOSER_UPGRADE_VERSION:v26.0.0-20260507}
    preview-frontend-root: ${COMPOSER_PREVIEW_FRONTEND_ROOT:/workspace/preview/frontend}
    preview-java-root: ${COMPOSER_PREVIEW_JAVA_ROOT:/app/src/main/java/com/zionex/t3composer/preview}
    preview-mvn-workdir: ${COMPOSER_PREVIEW_MVN_WORKDIR:/app}
    allow-write-patterns:
      - "**/view/**"
      - "**/data/menus.js"
      - "**/data/menus.js.patch"
      - "**/main/java/**"
      - "**/mssql/procedures/**"
      - "**/mssql/upgrade/**"
      - "**/oracle/procedures/**"
      - "**/oracle/upgrade/**"
  # Target 거버넌스 설정 스냅샷 — 시크릿 암호화 마스터키 + 스냅샷 대상 루트.
  snapshot:
    secret-key: ${COMPOSER_SNAPSHOT_SECRET_KEY:}
  governance-snapshot:
    repo-root: ${COMPOSER_REPO_ROOT:/workspace/repo}

# Anthropic API key — 우선순위: 1) DB 의 TB_IS_EXTRNLAPIKEY  2) 이 환경변수
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

logging:
  level:
    root: INFO
    com.zionex.t3composer: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
