<!DOCTYPE html>
<meta charset="UTF-8">
<title>불량 파레토차트</title>
<!-- T3MES UI Pattern · mes_qc_1_operation · TabPage #18: 불량 파레토차트 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p17">
    <div class="sec-hdr"><div><h3>⑱ 불량 유형 파레토 차트 (Pareto Chart)</h3><span class="tip">"어떤 불량이 가장 많이 발생했는가?" 80대 20 법칙에 따라, 개선해야 할 최우선 불량 항목(Vital Few)을 시각화합니다.</span></div></div>
    <div class="card" style="padding:30px">
      <div class="card-title" style="margin-bottom:20px">이번 달 조립공정 불량 유형 Top 5</div>
      <div style="display:flex;align-items:center;margin-bottom:12px"><span style="width:120px">1. 표면 스크래치</span><div class="chart-bar-wrap"><div class="c-bar" style="width:60%;background:var(--red)">350건 (40%)</div></div></div>
      <div style="display:flex;align-items:center;margin-bottom:12px"><span style="width:120px">2. 조립 누락</span><div class="chart-bar-wrap"><div class="c-bar" style="width:40%;background:var(--amber)">210건 (24%)</div></div></div>
      <div style="display:flex;align-items:center;margin-bottom:12px"><span style="width:120px">3. 치수 미달</span><div class="chart-bar-wrap"><div class="c-bar" style="width:25%;background:var(--amber)">120건 (14%)</div></div></div>
      <div style="display:flex;align-items:center;margin-bottom:12px"><span style="width:120px">4. 파티클 이물</span><div class="chart-bar-wrap"><div class="c-bar" style="width:15%;background:var(--blue)">80건 (9%)</div></div></div>
      <div style="display:flex;align-items:center"><span style="width:120px">5. 라벨 오부착</span><div class="chart-bar-wrap"><div class="c-bar" style="width:5%;background:var(--blue)">30건 (3%)</div></div></div>
    </div>
  </div>
