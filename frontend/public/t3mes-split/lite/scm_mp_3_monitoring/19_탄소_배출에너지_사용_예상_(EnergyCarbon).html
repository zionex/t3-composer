<div class="panel" id="p18">
      <div class="sec-hdr"><div><h3>19. 탄소 배출/에너지 사용 예상 (Energy/Carbon)</h3><span class="tip">가동 시간을 기반으로 예상 전력 사용량과 탄소 배출량(tCO2e)을 계산합니다.</span></div></div>
      <div class="grid2" style="flex-shrink:0;margin-bottom:16px">

      </div>
