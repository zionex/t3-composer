<!DOCTYPE html>
<meta charset="UTF-8">
<title>라우팅 지정</title>
<!-- T3MES UI Pattern · mes_production_1_order · TabPage #5: 라우팅 지정 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p4">
    <div class="sec-hdr"><div><h3>⑤ 공정 라우팅(Routing) 지정형 지시</h3><span class="tip">하나의 제품을 만들기 위해 거쳐야 하는 공정 순서(절단->용접->도장)를 드래그로 설정하여 지시를 내립니다.</span></div><button class="btn btn-blue" onclick="showToast('설정된 라우팅으로 지시 발급 완료')">라우팅 지시 확정</button></div>
    <div style="display:flex;gap:20px;align-items:flex-start">
      <div class="card" style="width:300px"><div class="card-title">공정 마스터 (Drag)</div><div style="display:flex;flex-direction:column;gap:8px"><div class="badge badge-gray" style="padding:10px;font-size:13px;cursor:grab" draggable="true" ondragstart="rDrag(event)">절단 공정 (Cutting)</div><div class="badge badge-gray" style="padding:10px;font-size:13px;cursor:grab" draggable="true" ondragstart="rDrag(event)">용접 공정 (Welding)</div><div class="badge badge-gray" style="padding:10px;font-size:13px;cursor:grab" draggable="true" ondragstart="rDrag(event)">도장 공정 (Painting)</div><div class="badge badge-gray" style="padding:10px;font-size:13px;cursor:grab" draggable="true" ondragstart="rDrag(event)">조립 공정 (Assembly)</div><div class="badge badge-gray" style="padding:10px;font-size:13px;cursor:grab" draggable="true" ondragstart="rDrag(event)">최종 검사 (Inspection)</div></div></div>
      <div style="flex:1;background:var(--surface2);border:2px dashed var(--border2);border-radius:12px;padding:20px;min-height:300px;display:flex;align-items:center;gap:10px;overflow-x:auto" id="r-drop" ondragover="event.preventDefault()" ondrop="rDrop(event)">
        <div style="color:var(--text3);padding:0 20px">이곳으로 공정을 순서대로 드래그하세요 ➔</div>
      </div>
    </div>
  </div>
