<!DOCTYPE html>
<meta charset="UTF-8">
<title>RFID 게이트</title>
<!-- T3MES UI Pattern · mes_tracking_2_stock · TabPage #22: RFID 게이트 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p21">
    <div class="sec-hdr"><div><h3>㉒ RFID 게이트 대량 통과 감지 (Mass Tracking)</h3><span class="tip">지게차가 팔레트를 들고 게이트를 지나가면 수백 개의 RFID 태그가 1초 만에 스캔되어 위치가 일괄 변경됩니다.</span></div></div>
    <div class="card" style="text-align:center;padding:50px;border-color:var(--rose)">
      <div style="font-size:60px;margin-bottom:20px;animation:pulse 1s infinite">📡</div>
      <div style="font-size:24px;font-weight:700;color:var(--rose)">RFID 게이트 A 통과 감지 중...</div>
      <div style="color:var(--text2);margin-top:10px;margin-bottom:30px">지게차 이동 시 재고 위치(로케이션)가 자동 갱신됩니다.</div>
      <button class="btn btn-rose" style="padding:16px 30px;font-size:18px" onclick="showToast('가상 태그 500개 인식! 위치 이동 완료')">가상 태그 500개 수신 시뮬레이션 ⚡</button>
    </div>
  </div>
