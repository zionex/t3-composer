<!DOCTYPE html>
<meta charset="UTF-8">
<title>우선순위 큐 랭킹</title>
<!-- T3MES UI Pattern · scm_mp_2_plan · TabPage #16: 우선순위 큐 랭킹 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p15">
  <div class="sec-hdr">
    <div>
      <h3>⑯ 우선순위 큐 랭킹 보정 (Rank-based Rescheduling)</h3>
      <span class="tip">목록을 드래그하여 순위를 변경하면 예상 착수/납기일이 자동 재계산됩니다.</span>
    </div>
    <div class="flex-gap">
      <button class="btn btn-ghost btn-sm" onclick="genP15()">⟳ 초기화</button>
      <button class="btn btn-blue" onclick="showToast('랭크 기반 확정')">순위 기반 확정</button>
    </div>
  </div>
  <div class="grid2" style="grid-template-columns: 1fr 300px;">
    <div class="card" style="margin:0; max-height:600px; overflow-y:auto;" id="rank-list"></div>
    <div class="card" style="margin:0;">
      <div class="card-title">자동 계산 요약</div>
      <div class="alert-box alert-amber"><div class="alert-icon">💡</div><div><div style="font-weight:700">순서를 변경해 보세요</div><div style="font-size:11px;color:var(--text2);margin-top:4px">드래그로 순위를 올리면 예상 착수일이 앞당겨집니다.</div></div></div>
      <div style="margin-top:20px;"><div class="label">대기 오더</div><div style="font-family:var(--mono);font-size:24px;color:var(--blue)">12건</div><div class="label mt12">납기 지연 예상</div><div style="font-family:var(--mono);font-size:24px;color:var(--red)" id="rank-delay-cnt">0건</div></div>
    </div>
  </div>
</div>
