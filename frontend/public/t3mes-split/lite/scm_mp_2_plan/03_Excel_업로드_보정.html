<!DOCTYPE html>
<meta charset="UTF-8">
<title>Excel 업로드 보정</title>
<!-- T3MES UI Pattern · scm_mp_2_plan · TabPage #3: Excel 업로드 보정 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p2">
  <div class="sec-hdr">
    <div>
      <h3>③ Excel 파일 업로드 일괄 보정</h3>
      <span class="tip">엑셀 템플릿을 수정하여 업로드. 서식 오류/중복/용량초과를 행별로 실시간 검증합니다.</span>
    </div>
  </div>
  <div class="grid2" style="grid-template-columns:380px 1fr">
    <div>
      <div class="card">
        <div class="card-title">Step 1. 파일 업로드</div>
        <div class="drop-zone" id="dz2" onclick="fakeUpload2()">
          <div style="font-size:36px;margin-bottom:8px">📁</div>
          <div style="font-weight:700;color:var(--cyan)">클릭하여 업로드</div>
        </div>
      </div>
      <div class="card" id="upload-stat" style="display:none">
        <div class="card-title">업로드 결과</div>
        <div class="grid3" style="text-align:center">
          <div><div class="label">전체</div><div style="font-family:var(--mono);font-size:20px" id="u2-total">0</div></div>
          <div><div class="label">정상</div><div style="font-family:var(--mono);color:var(--green);font-size:20px" id="u2-ok">0</div></div>
          <div><div class="label">오류</div><div style="font-family:var(--mono);color:var(--red);font-size:20px" id="u2-err">0</div></div>
        </div>
        <button class="btn btn-blue" style="width:100%;margin-top:12px" onclick="showToast('정상 행만 반영 완료')">✓ 정상 행 일괄 반영</button>
      </div>
    </div>
    <div class="tbl-wrap" style="display:none;max-height:600px" id="wrap2">
      <table class="tbl">
        <thead><tr><th>행</th><th>발주번호</th><th>품목코드</th><th>보정일자</th><th class="num">보정수량</th><th>검증결과</th><th>오류 내용</th></tr></thead>
        <tbody id="tb2"></tbody>
      </table>
    </div>
  </div>
</div>
