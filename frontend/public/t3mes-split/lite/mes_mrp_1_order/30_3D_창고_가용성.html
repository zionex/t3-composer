<!DOCTYPE html>
<meta charset="UTF-8">
<title>3D 창고 가용성</title>
<!-- T3MES UI Pattern · mes_mrp_1_order · TabPage #30: 3D 창고 가용성 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p29">
    <div class="sec-hdr"><div><h3>㉚ 3D 디지털 트윈 창고 가용성 뷰</h3><span class="tip">대량의 부피가 큰 자재를 발주하기 전, 우리 공장의 3D 모델링 창고를 띄워 물건을 적재할 빈 공간(빈 선반)이 있는지 확인합니다.</span></div></div>
    <div class="grid2" style="height:450px">
      <div style="background:#000;border-radius:12px;border:1px solid var(--border);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden">
        <div style="position:absolute;width:200%;height:200%;background:repeating-linear-gradient(45deg, #111 0, #111 20px, #222 20px, #222 40px);opacity:0.3;transform:rotateX(60deg) scaleY(2)"></div>
        <div style="position:relative;z-index:2;width:80px;height:120px;background:var(--red-dim);border:2px solid var(--red);margin-right:10px;display:flex;align-items:center;justify-content:center"><div style="font-weight:700;color:var(--red);font-size:10px">Rack A<br>98% Full</div></div>
        <div style="position:relative;z-index:2;width:80px;height:120px;background:var(--cyan-dim);border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 15px var(--cyan)" onclick="showToast('가상 3D 공간: Rack B에 적재 공간 충분함 확인')"><div style="font-weight:700;color:var(--cyan);font-size:10px">Rack B<br>비어있음</div></div>
      </div>
      <div class="card" style="margin:0;display:flex;flex-direction:column">
        <div class="card-title">도착 예정 자재의 체적(CBM) 검증</div>
        <div style="font-size:14px;margin-bottom:10px">발주할 품목의 부피: <b>45 CBM (대형)</b></div>
        <div style="color:var(--cyan);font-weight:700;margin-bottom:20px">✓ 3D 트윈 시뮬레이션 결과, B구역 랙(Rack)에 적재 공간이 충분합니다.</div>
        <button class="btn btn-cyan" style="padding:16px;font-size:16px;margin-top:auto" onclick="showToast('도착 예정 창고 구역이 지정되어 발주되었습니다.')">공간 확인됨 - 대량 발주 확정</button>
      </div>
    </div>
  </div>
