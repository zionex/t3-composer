<!DOCTYPE html>
<meta charset="UTF-8">
<title>추적 칸반 보드</title>
<!-- T3MES UI Pattern · mes_tracking_1_order · TabPage #4: 추적 칸반 보드 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p3">
    <div class="sec-hdr"><div><h3>④ 추적 칸반 보드 (Order Kanban)</h3><span class="tip">영업/물류 담당자가 주문들이 어느 단계에 병목(Bottleneck)이 걸려있는지 열(Column) 단위로 파악합니다.</span></div></div>
    <div class="kanban" id="kb-wrap">
      <div class="k-col"><div style="font-weight:700">1. 주문접수 (New)</div><div id="k3_1"></div></div>
      <div class="k-col"><div style="font-weight:700;color:var(--cyan)">2. 생산중 (WIP)</div><div id="k3_2"></div></div>
      <div class="k-col"><div style="font-weight:700;color:var(--amber)">3. 포장/출하대기</div><div id="k3_3"></div></div>
      <div class="k-col"><div style="font-weight:700;color:var(--blue)">4. 배송중 (In Transit)</div><div id="k3_4"></div></div>
      <div class="k-col" style="border-color:var(--green-mid);background:var(--green-dim)"><div style="font-weight:700;color:var(--green)">5. 배송완료 (Delivered)</div><div id="k3_5"></div></div>
    </div>
  </div>
