<div class="panel" id="p1">
    <div class="sec-hdr"><div><h3>② 엑셀 대량 일괄 지시 (Bulk Upload)</h3><span class="tip">ERP나 생산계획팀에서 엑셀로 내려온 주간/월간 생산계획 수백 건을 한 번에 시스템에 밀어 넣습니다. (500건 자동생성)</span></div></div>

    <div class="tbl-wrap" style="display:none" id="wrap1"><table class="tbl"><thead><tr><th>행</th><th>계획품목</th><th>지시수량</th><th>납기일</th><th>BOM/라우팅 검증 결과</th></tr></thead><tbody id="tb1"></tbody></table><div style="text-align:right;padding:16px;background:var(--surface2)"><button class="btn btn-blue" onclick="showToast('정상 475건 일괄 작업지시 발행 완료')">오류 제외하고 일괄 지시 발행</button></div></div>
