# Babelfish for PostgreSQL PoC — composer-db 대체 가능성 측정
#
# 사용법:
#   cd docker/babelfish-poc
#   docker compose up -d
#   # T-SQL 접속: sqlcmd -S localhost,11434 -U sa -P "Composer!2026"
#   # PG 접속:    psql -h localhost -p 15432 -U sa -d t3smartscm
#
# 기존 composer-db (MSSQL 11433) 와 무관하게 동시 가동 가능.
# 호환성 측정 끝나면: docker compose down -v 로 깨끗이 정리.

services:
  composer-db-bbf:
    image: jonathanpotts/babelfishpg:BABEL_5_4_0__PG_17_7
    container_name: composer-db-bbf
    environment:
      # jonathanpotts/babelfishpg 의 기본 user/db 를 명시 override.
      # T-SQL 접속 시 'sa' 로 SQL Server 관례와 일치시킴.
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: ${MSSQL_SA_PASSWORD:-Composer!2026}
      POSTGRES_DB: t3smartscm
      BABELFISH_MIGRATION_MODE: single-db
    ports:
      - "11434:1433"   # T-SQL/TDS — mssql-jdbc 그대로 접속 가능
      - "15432:5432"   # PG native — psql 진단/내부 점검용
    volumes:
      - composer-db-bbf-data:/var/lib/babelfish/data
      # SP 적용 시험용 — 호스트 의 mssql SP 폴더를 read-only 마운트
      - ${COMPOSER_DATABASE_REF_PATH:-../../../t3series/t3series-database}:/workspace/database:ro
      # PoC 결과 기록용 (스크립트가 여기 결과 파일 작성)
      - ./results:/workspace/results
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d t3smartscm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: "no"

volumes:
  composer-db-bbf-data:
    driver: local
