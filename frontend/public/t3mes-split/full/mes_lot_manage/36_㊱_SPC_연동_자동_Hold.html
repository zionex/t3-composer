<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOT Tracking UI (50 Types) - Ultimate Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* 반도체 FAB 테마: Dark Sci-Fi, Neon Cyan, Purple, Magenta */
  --bg:#06090e;--surface:#0d131f;--surface2:#151d2e;--surface3:#1f2b42;
  --border:#2a3a59;--border2:#3d527a;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --cyan:#00e5ff;--cyan-dim:#00e5ff22;
  --purple:#b026ff;--purple-dim:#b026ff22;
  --magenta:#ff007f;--magenta-dim:#ff007f22;
  --green:#39ff14;--green-dim:#39ff1422;
  --amber:#ffea00;--amber-dim:#ffea0022;
  --red:#ff003c;--red-dim:#ff003c22;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --radius:6px;
}

body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:12px;line-height:1.5;overflow-y:scroll}
.app{min-height:100vh;display:flex;flex-direction:column}

/* Tab Nav (5 Groups x 10 Tabs = 50 Tabs) */
.tab-nav{display:flex;gap:2px;padding:10px 10px 0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) var(--surface)}
.tab-nav::-webkit-scrollbar{height:6px}
.tab-nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.tab-btn{flex-shrink:0;padding:8px 12px;border:none;background:transparent;color:var(--text2);font-size:12px;font-family:var(--sans);cursor:pointer;border-radius:var(--radius) var(--radius) 0 0;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.tab-btn:hover{background:var(--surface2);color:var(--text)}
.tab-num{display:inline-block;background:var(--surface3);color:var(--text3);font-size:10px;font-family:var(--mono);padding:2px 4px;border-radius:3px;font-weight:700}

/* Groups: 1=Cyan(생성), 2=Purple(분할/병합), 3=Green(진행/실적), 4=Red(품질/보류), 5=Amber(추적/분석) */
.t-1.active{color:var(--cyan);border-bottom-color:var(--cyan)}.t-1.active .tab-num{color:var(--cyan);background:var(--cyan-dim)}
.t-2.active{color:var(--purple);border-bottom-color:var(--purple)}.t-2.active .tab-num{color:var(--purple);background:var(--purple-dim)}
.t-3.active{color:var(--green);border-bottom-color:var(--green)}.t-3.active .tab-num{color:var(--green);background:var(--green-dim)}
.t-4.active{color:var(--red);border-bottom-color:var(--red)}.t-4.active .tab-num{color:var(--red);background:var(--red-dim)}
.t-5.active{color:var(--amber);border-bottom-color:var(--amber)}.t-5.active .tab-num{color:var(--amber);background:var(--amber-dim)}

/* Panel & Card */
.panel{display:none;padding:16px;background:var(--surface2);flex:1;animation:fadeIn .2s}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 4px 6px rgba(0,0,0,0.3)}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--border);padding-bottom:8px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-hdr h3{font-size:16px;font-weight:700;color:var(--text);text-shadow:0 0 10px rgba(255,255,255,0.2)}
.tip{font-size:11px;color:var(--text3);display:block;margin-top:2px}

/* Tables */
.tbl-wrap{overflow-y:auto;max-height:500px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
.tbl th{position:sticky;top:0;z-index:10;padding:8px 10px;text-align:left;font-size:11px;color:var(--text2);background:var(--surface3);border-bottom:1px solid var(--border);font-weight:700;box-shadow:0 1px 0 var(--border)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.tbl tr:hover td{background:var(--surface3)}
.tbl td.num{text-align:right;font-family:var(--mono)}

/* Forms */
.inp{background:var(--surface3);border:1px solid var(--border);border-radius:4px;padding:6px 10px;color:var(--text);font-family:var(--sans);font-size:12px;width:100%;outline:none}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 5px var(--cyan-dim)}
.inp-sm{padding:4px 6px;font-size:11px;font-family:var(--mono)}
.label{font-size:10px;color:var(--text2);margin-bottom:4px;display:block;font-weight:700;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 16px;border:1px solid;border-radius:4px;font-size:12px;font-family:var(--sans);font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-cyan{background:var(--cyan-dim);border-color:#00e5ff55;color:var(--cyan);text-shadow:0 0 5px var(--cyan)}
.btn-purple{background:var(--purple-dim);border-color:#b026ff55;color:var(--purple)}
.btn-green{background:var(--green-dim);border-color:#39ff1455;color:var(--green)}
.btn-red{background:var(--red-dim);border-color:#ff003c55;color:var(--red)}
.btn-amber{background:var(--amber-dim);border-color:#ffea0055;color:var(--amber)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text2)}
.btn-sm{padding:4px 10px;font-size:11px}

.badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;font-family:var(--mono)}

/* Layouts */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.prog-bg{background:var(--surface3);height:6px;border-radius:3px;overflow:hidden;margin-top:4px}
.prog-bar{height:100%;background:var(--cyan)}

/* --- SEMI Specific UI Components --- */
/* Wafer Map (25 Slots) */
.wafer-map{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px;background:var(--surface3);border-radius:50%;width:200px;height:200px;margin:0 auto;border:2px solid var(--border2);align-items:center;justify-content:center}
.w-slot{width:28px;height:28px;border-radius:50%;background:var(--green);border:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:var(--mono);color:#000;font-weight:700;cursor:pointer;transition:transform .1s}
.w-slot:hover{transform:scale(1.2)}
.w-slot.ng{background:var(--red)}
.w-slot.skip{background:var(--surface);border-color:var(--border);color:var(--text3)}
.w-slot.sel{border:2px solid #fff;box-shadow:0 0 10px #fff}

/* FOUP / Carrier View */
.foup-view{display:flex;flex-direction:column-reverse;gap:2px;background:var(--surface3);padding:10px;border:2px solid var(--border2);border-top-left-radius:10px;border-top-right-radius:10px;width:100px;margin:0 auto}
.f-slot{height:8px;background:var(--surface);border:1px solid var(--border);border-radius:2px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:7px;color:var(--text3);cursor:pointer}
.f-slot.full{background:var(--cyan);color:#000;box-shadow:0 0 5px var(--cyan)}
.f-slot.sel{background:var(--magenta);box-shadow:0 0 8px var(--magenta)}

/* Genealogy Topology */
.topo-wrap{display:flex;gap:40px;overflow-x:auto;padding:20px;align-items:center;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);min-height:300px}
.topo-col{display:flex;flex-direction:column;gap:15px;position:relative;min-width:200px}
.topo-node{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:var(--radius);padding:12px;box-shadow:0 4px 6px rgba(0,0,0,0.4);position:relative;cursor:pointer;transition:all .2s}
.topo-node:hover{transform:translateY(-2px);border-color:var(--magenta);box-shadow:0 0 15px var(--magenta-dim)}
.topo-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);font-size:10px;white-space:nowrap}
.topo-line{width:30px;height:2px;background:var(--border2);position:relative;margin:4px 0}
.topo-line::after{content:'';position:absolute;right:-2px;top:-3px;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid var(--border2)}

/* Toast */
#toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--cyan);color:var(--cyan);padding:12px 20px;border-radius:var(--radius);font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;box-shadow:0 0 15px var(--cyan-dim)}
#toast.show{opacity:1}
</style>
<style>/* T3MES split — hide tab navigation */.tab-nav,#tab-nav{display:none !important;}</style>
</head>
<body>

<div class="app">
<div class="tab-nav" id="tab-nav"></div>

<div id="panels">
  </div>

<div id="toast">메시지</div>

<script>
// --- Data & Config ---
const tabGroups = [
  { c: 't-1', n: [ "① 기본 LOT 생성", "② Wafer 투입(Start)", "③ 대량 LOT 생성", "④ 외주 LOT 수신", "⑤ R&D/Eng LOT", "⑥ Dummy/Monitor", "⑦ 재작업 파생 LOT", "⑧ 가상 LOT 생성", "⑨ 자동 스케줄 생성", "⑩ 라벨 인쇄/발행" ] }, // Group 1: Creation
  { c: 't-2', n: [ "⑪ 정규 분할(Split)", "⑫ Wafer 단위 분할", "⑬ 정규 병합(Merge)", "⑭ FOUP/Carrier 변경", "⑮ 캐파기반 자동분할", "⑯ 불량 격리 분할", "⑰ 샘플링용 분할", "⑱ Carrier 병합", "⑲ 잔량(Scrap) 분할", "⑳ 분할/병합 이력조회" ] }, // Group 2: Split/Merge
  { c: 't-3', n: [ "㉑ Track-In (시작)", "㉒ Track-Out (종료)", "㉓ Batch Track-In", "㉔ 레시피 바인딩", "㉕ 소모품/지그 매핑", "㉖ 강제종료(Abort)", "㉗ 공정데이터(EDC)", "㉘ 설비연동 자동 Out", "㉙ 공정별 수율 입력", "㉚ 설비 파라미터 이력" ] }, // Group 3: Execution
  { c: 't-4', n: [ "㉛ LOT 보류(Hold)", "㉜ Hold 해제(Release)", "㉝ Wafer 부분 폐기", "㉞ LOT 전체 폐기", "㉟ 재작업 라우팅 지정", "㊱ SPC 연동 자동 Hold", "㊲ Wafer Defect Map", "㊳ QA 샘플링 검사", "㊴ 보류 사유 분석", "㊵ 클레임 역추적" ] }, // Group 4: Quality/Hold
  { c: 't-5', n: [ "㊶ 실시간 WIP 대시보드", "㊷ 공정 Q-Time 모니터", "㊸ LOT TAT(소요) 분석", "㊹ 정체/지연 LOT 경고", "㊺ Hot/긴급 LOT 뷰", "㊻ 2D 설비별 위치맵", "㊼ 3D FOUP 적재 뷰어", "㊽ OHT 자동반송 추적", "㊾ 챗봇 LOT 위치조회", "㊿ 궁극의 Genealogy" ] } // Group 5: Tracking/Topology
];

const tabFlat = tabGroups.flatMap(g => g.n.map(name => ({ name, class: g.c })));

function init() {
  // 1. Render Tabs
  const nav = document.getElementById('tab-nav');
  tabFlat.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = `tab-btn ${t.class} ${i===0?'active':''}`;
    btn.innerHTML = `${t.name}`;
    btn.onclick = () => switchTab(i, btn);
    nav.appendChild(btn);
  });

  // 2. Render Panels (Dynamic Generation to save space)
  const container = document.getElementById('panels');
  let html = '';
  for(let i=0; i<50; i++) {
    html += `<div class="panel ${i===0?'active':''}" id="p${i}"></div>`;
  }
  container.innerHTML = html;

  // 3. Inject Content into Panels
  injectContent();
}

function switchTab(i, btnEl) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  if(btnEl) btnEl.classList.add('active');
  else document.querySelectorAll('.tab-btn')[i].classList.add('active');
  document.querySelectorAll('.panel').forEach((p, idx) => p.classList.toggle('active', idx===i));
}

function showToast(msg){
  const t = document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}
const rInt = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
const $ = id => document.getElementById(id);

// --- Massive Data Generators & Template Builders ---
function buildTable(headers, rows, maxH="500px") {
  let ths = headers.map(h => `<th>${h}</th>`).join('');
  let trs = rows.map(r => `<tr>${r.map(d => `<td>${d}</td>`).join('')}</tr>`).join('');
  return `<div class="tbl-wrap" style="max-height:${maxH}"><table class="tbl"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

function getStatusBadge(stat) {
  const c = { '대기':'gray', '진행중':'green', 'Hold':'red', '완료':'cyan', '폐기':'red', '긴급':'magenta' }[stat] || 'gray';
  const cVar = `var(--${c})`; const bgVar = `var(--${c}-dim)`;
  return `<span class="badge" style="background:${bgVar};color:${cVar}">${stat}</span>`;
}

function genLotCode(prefix) { return `${prefix}-${rInt(2400,2499)}-${String(rInt(1,9999)).padStart(4,'0')}`; }

// --- Content Injection Logic ---
function injectContent() {
  // P0: 1. 기본 LOT 생성 (BOM to LOT)
  let p0_rows = [];
  for(let i=0; i<100; i++) p0_rows.push([genLotCode('PRD'), `제품 Product-${rInt(1,20)}`, '25 WFR', 'FRONT_END_ROUTING', getStatusBadge('대기'), '2024-11-01']);
  $('p0').innerHTML = `
    <div class="sec-hdr"><div><h3>① 기본 생산 LOT 생성 (Order Release)</h3><span class="tip">ERP의 작업지시(WO)를 기반으로 물리적인 LOT_NO를 대량 발급합니다.</span></div><button class="btn btn-cyan" onclick="showToast('100건 LOT 생성 완료')">LOT 일괄 생성</button></div>
    <div class="grid2">
      <div class="card"><div class="card-title">생산계획 (WO) 마스터</div>${buildTable(['작업지시번호','품목','지시수량','투입예정'], [[`WO-2024-991`, `Product-A`, `500 WFR`, `11/01`],[`WO-2024-992`, `Product-B`, `200 WFR`, `11/02`]], '200px')}
      <div class="label" style="margin-top:16px">LOT 당 분할 수량 (Standard Qty)</div><input type="number" class="inp" value="25" style="font-size:20px;font-weight:700;color:var(--cyan);width:150px"> WFR / LOT</div>
      <div class="card" style="margin:0"><div class="card-title">생성된 LOT 리스트 (가상 데이터 100건)</div>${buildTable(['생성된 LOT_NO','품목명','수량','라우팅','상태','투입일'], p0_rows, '400px')}</div>
    </div>`;

  // P1: 2. Wafer Start
  let wMap = '';
  for(let i=1;i<=25;i++) wMap+=`<div class="w-slot full" onclick="this.classList.toggle('skip')">${i}</div>`;
  $('p1').innerHTML = `
    <div class="sec-hdr"><div><h3>② Wafer 투입 (Wafer Start & FOUP Map)</h3><span class="tip">물리적인 빈 웨이퍼(Blank)를 FOUP(캐리어)의 슬롯에 매핑하여 LOT에 생명을 불어넣습니다.</span></div></div>
    <div class="grid2">
      <div class="card"><div class="card-title">대상 LOT 및 캐리어 할당</div><div class="label">대상 LOT_NO</div><input type="text" class="inp" value="PRD-2401-0001" disabled style="margin-bottom:12px;color:var(--cyan);font-weight:700"><div class="label">투입할 FOUP (RFID 스캔)</div><input type="text" class="inp" value="F-889123" style="border-color:var(--cyan)"><button class="btn btn-cyan" style="width:100%;margin-top:20px" onclick="showToast('Wafer Start 및 캐리어 매핑 완료')">Wafer Start (투입 확정)</button></div>
      <div class="card"><div class="card-title">FOUP 슬롯 맵핑 (25 Slots)</div><div class="wafer-map">${wMap}</div><div class="tip" style="text-align:center;margin-top:10px">클릭하여 해당 슬롯 비활성화(Skip) 처리</div></div>
    </div>`;

  // P8: 9. 정규 분할 (Split)
  $('p8').innerHTML = `
    <div class="sec-hdr"><div><h3>⑨ 정규 분할 (LOT Split)</h3><span class="tip">25장짜리 Mother LOT를 특정 사유(장비 캐파, 긴급도)로 Child LOT로 분할합니다.</span></div></div>
    <div class="card" style="border-color:var(--purple);background:var(--purple-dim)"><div class="card-title" style="color:var(--purple)">Mother LOT</div><div style="font-size:24px;font-family:var(--mono);font-weight:700">PRD-2410-0010 <span style="font-size:14px;color:var(--text2)">(현재 25 WFR)</span></div></div>
    <div class="grid2">
      <div class="card"><div class="card-title">분할 설정</div><div class="label">분할해낼 수량 (Child로 보낼 수량)</div><input type="number" class="inp" value="10" style="font-size:24px;color:var(--purple);font-weight:700;text-align:right"><div class="tip" style="margin-top:10px;font-size:14px">Mother 잔량: 15 WFR</div><button class="btn btn-purple" style="width:100%;margin-top:20px" onclick="showToast('분할되어 Child LOT가 발급되었습니다.')">분할(Split) 실행 ➔</button></div>
      <div class="card"><div class="card-title">생성된 Child LOT</div><div style="border:2px dashed var(--purple);padding:30px;text-align:center;border-radius:8px"><div style="font-size:24px;font-family:var(--mono);color:var(--purple);font-weight:700">PRD-2410-0010<span style="color:var(--magenta)">-A</span></div><div style="font-size:16px;margin-top:10px">수량: <b style="color:var(--magenta)">10 WFR</b></div></div></div>
    </div>`;

  // P9: 10. Wafer 단위 분할 (Slot Split)
  let fSlots=''; for(let i=25;i>=1;i--) fSlots+=`<div class="f-slot full" onclick="this.classList.toggle('sel')">Slot ${String(i).padStart(2,'0')} <span>WFR-${i}</span></div>`;
  $('p9').innerHTML = `
    <div class="sec-hdr"><div><h3>⑩ Wafer 단위 지정 분할 (Slot-level Split)</h3><span class="tip">FOUP 내의 특정 슬롯(웨이퍼)만 핀셋으로 집어내듯 선택하여 분할합니다. 불량 분석용으로 많이 쓰입니다.</span></div></div>
    <div class="grid2">
      <div class="card" style="display:flex;flex-direction:column;align-items:center"><div class="card-title" style="width:100%">Mother FOUP (F-8891)</div><div class="foup-view">${fSlots}</div><div class="tip" style="margin-top:10px">분할할 슬롯을 클릭(다중선택) 하세요.</div></div>
      <div class="card"><div class="card-title">선택된 슬롯 리스트</div><div style="padding:20px;background:var(--surface3);border-radius:8px;font-family:var(--mono);color:var(--magenta);font-size:16px;min-height:100px">Slot 15, Slot 16, Slot 20</div><div class="label" style="margin-top:20px">이동할 새 캐리어 (Target FOUP)</div><input type="text" class="inp" placeholder="스캔..."><button class="btn btn-purple" style="width:100%;margin-top:20px" onclick="showToast('선택된 웨이퍼가 새 LOT로 분할 이관되었습니다.')">선택 슬롯 분할 확정</button></div>
    </div>`;

  // P10: 11. 정규 병합 (Merge)
  let p10_rows = [];
  for(let i=1; i<=10; i++) p10_rows.push([`<input type="checkbox">`, `PRD-2410-00${i}-A`, `10 WFR`, `Photo-01 공정 대기`]);
  $('p10').innerHTML = `
    <div class="sec-hdr"><div><h3>⑪ 정규 병합 (LOT Merge)</h3><span class="tip">동일한 스펙과 공정을 타는 작은 LOT들을 모아서 하나의 큰 LOT(Max 25장)로 합칩니다.</span></div></div>
    <div class="grid2">
      <div class="card"><div class="card-title">병합 가능한 대기 LOT 리스트</div>${buildTable(['선택','LOT_NO','수량','현재위치'], p10_rows, '300px')}</div>
      <div class="card" style="text-align:center;display:flex;flex-direction:column;justify-content:center"><div style="font-size:50px">🔗</div><div style="font-size:18px;font-weight:700;margin:20px 0">선택된 LOT들을 하나로 병합합니다.</div><div class="tip" style="margin-bottom:20px">합계 수량: 20 WFR (Limit: 25)</div><button class="btn btn-purple" style="padding:16px;font-size:16px" onclick="showToast('병합되어 새 Mother LOT가 되었습니다.')">병합 (Merge) 실행 ➔</button></div>
    </div>`;

  // P16: 17. Track-In (작업 시작)
  let p16_rows = [];
  for(let i=1; i<=50; i++) p16_rows.push([genLotCode('PRD'), '25', getStatusBadge('대기'), `<button class="btn btn-ghost btn-sm" onclick="showToast('Track-In 처리됨')">Track-In ➔</button>`]);
  $('p16').innerHTML = `
    <div class="sec-hdr"><div><h3>⑰ 설비 Track-In (작업 시작)</h3><span class="tip">설비에 LOT를 걸고 가공을 시작(Track-In)하는 화면입니다. (가상 대기열 50건)</span></div></div>
    <div class="grid2" style="grid-template-columns: 300px 1fr">
      <div class="card" style="border-color:var(--green)"><div class="card-title" style="color:var(--green)">대상 설비 (Equipment)</div><div style="font-family:var(--mono);font-size:24px;font-weight:700;margin-bottom:10px">EQP-ETCH-05</div><div class="label">현재 상태</div><span class="badge" style="background:var(--green-dim);color:var(--green);font-size:14px">Idle (대기중)</span><div class="label" style="margin-top:20px">레시피 (Recipe)</div><input type="text" class="inp" value="REC-ETCH-NANO-01" disabled></div>
      <div class="card" style="margin:0"><div class="card-title">설비 앞 대기열 (Queue)</div>${buildTable(['대기 LOT','수량','상태','액션'], p16_rows, '400px')}</div>
    </div>`;

  // P24: 25. LOT Hold (보류)
  let p24_rows = [];
  for(let i=1; i<=100; i++) p24_rows.push([`<input type="checkbox">`, genLotCode('PRD'), 'Photo-03', '25', `<span class="badge badge-gray">Run</span>`]);
  $('p24').innerHTML = `
    <div class="sec-hdr"><div><h3>㉕ LOT Hold (보류 / 잠금)</h3><span class="tip">수율 저하, 레시피 오류 의심 등으로 진행 중인 LOT를 강제로 멈춰 세웁니다(Hold). (100건)</span></div></div>
    <div class="grid2">
      <div class="card"><div class="card-title">진행중인 LOT 리스트</div>${buildTable(['선택','LOT_NO','현재공정','수량','상태'], p24_rows, '400px')}</div>
      <div class="card" style="border-color:var(--red);background:var(--surface2)"><div class="card-title" style="color:var(--red)">Hold (보류) 설정</div><div class="label">Hold 사유 코드</div><select class="inp" style="margin-bottom:16px"><option>ENG-01: 엔지니어 확인 필요</option><option>QC-02: 수율 저하 의심</option><option>OOS: 설비 Out of Spec</option></select><div class="label">상세 코멘트</div><textarea class="inp" rows="4" style="margin-bottom:20px">CD(선폭) 측정값 이상 발생으로 인한 일시 보류</textarea><button class="btn btn-red" style="width:100%;padding:16px;font-size:16px" onclick="showToast('선택된 LOT들이 Hold 처리되었습니다.')">Hold (잠금) 실행 🔒</button></div>
    </div>`;

  // P30: 31. Defect Map
  let dMap = '';
  for(let i=1; i<=25; i++) dMap += `<div class="w-slot ${Math.random()>0.8?'ng':''}" onclick="this.classList.toggle('ng')">${i}</div>`;
  $('p30').innerHTML = `
    <div class="sec-hdr"><div><h3>㉛ Wafer Defect Map (불량 맵핑)</h3><span class="tip">검사 장비에서 올라온 데이터 또는 작업자 육안 검사 결과를 Wafer 단위로 매핑하여 불량(Scrap) 처리합니다.</span></div></div>
    <div class="grid2" style="grid-template-columns: 300px 1fr">
      <div class="card" style="text-align:center"><div class="card-title" style="justify-content:center">FOUP (LOT-991) Defect Map</div><div class="wafer-map" style="margin:20px auto">${dMap}</div><div class="tip" style="margin-top:20px">빨간색: 불량(NG) 판정 웨이퍼</div></div>
      <div class="card"><div class="card-title">Defect Code 등록</div><div class="label">선택된 불량 웨이퍼</div><div style="font-family:var(--mono);font-size:18px;color:var(--red);font-weight:700;margin-bottom:16px">Slot 03, Slot 15, Slot 22 (총 3장)</div><div class="label">불량 코드 (Defect Code)</div><select class="inp" style="margin-bottom:16px"><option>SCRATCH (표면 스크래치)</option><option>PARTICLE (이물질)</option><option>PATTERN_DEFECT (패턴불량)</option></select><button class="btn btn-red" style="width:100%" onclick="showToast('불량 판정 및 Scrap 처리 완료')">선택된 웨이퍼 Scrap(폐기) 확정</button></div>
    </div>`;

  // P32: 33. WIP Dashboard
  let p32_rows = [];
  const steps = ["1000: Wafer Cleaning", "2000: Oxidation", "3000: Photoresist", "4000: Exposure", "5000: Etching", "6000: Ion Implantation", "7000: CVD", "8000: Metallization"];
  steps.forEach(s => {
    const q = rInt(50, 500); const run = rInt(10, q); const wait = q-run;
    p32_rows.push([s, `<span style="font-weight:700;color:var(--cyan)">${q}</span>`, wait, `<span style="color:var(--green)">${run}</span>`, rInt(0, 5)]);
  });
  $('p32').innerHTML = `
    <div class="sec-hdr"><div><h3>㉝ 실시간 공정별 WIP(재공) 대시보드</h3><span class="tip">FAB 전체의 공정별로 머물러 있는 LOT의 수량과 상태(Wait, Run, Hold)를 실시간 모니터링합니다.</span></div><button class="btn btn-amber">새로고침 ↻</button></div>
    ${buildTable(['공정 단계 (Step)','총 대기 LOT수','대기(Wait)','진행(Run)','보류(Hold)'], p32_rows, '600px')}`;

  // P35: 36. Delayed LOT Alert
  let p35_rows = [];
  for(let i=1; i<=30; i++) {
    const hTime = rInt(24, 200);
    p35_rows.push([genLotCode('PRD'), 'Photo-05', `<span style="color:var(--red);font-weight:700">${hTime} 시간</span>`, '장비 고장으로 인한 대기', `<button class="btn btn-ghost btn-sm">독촉 메일</button>`]);
  }
  $('p35').innerHTML = `
    <div class="sec-hdr"><div><h3>㊱ 정체/지연 LOT (Stagnant LOT) 경고판</h3><span class="tip">특정 공정에서 설정된 Q-Time(대기시간 제한)을 초과하여 썩고 있는 악성 LOT들만 빨갛게 띄워줍니다. (30건)</span></div></div>
    ${buildTable(['LOT_NO','정체된 공정','체류 시간 (Hold Time)','사유 (Reason)','액션'], p35_rows, '600px')}`;

  // P49: 50. Master Topology (Genealogy)
  $('p49').innerHTML = `
    <div class="sec-hdr"><div><h3>㊿ 궁극의 LOT Genealogy (족보/토폴로지 추적)</h3><span class="tip">하나의 웨이퍼가 어떻게 쪼개지고 합쳐져서 최종 Chip이 되었는지, N:M 분할/병합 이력을 트리 구조로 완벽하게 시각화합니다.</span></div></div>
    <div class="topo-wrap">
      <div class="topo-col">
        <div style="font-weight:700;color:var(--text2);margin-bottom:5px">1. 원자재 투입</div>
        <div class="topo-node"><div style="font-family:var(--mono);font-size:11px;color:var(--blue);margin-bottom:4px">MAT-WFR-001</div><div style="font-weight:700;font-size:14px;margin-bottom:4px">Bare Wafer 투입</div><div class="badge" style="background:var(--green-dim);color:var(--green)">100 WFR</div></div>
      </div>
      <div class="topo-arrow">Wafer Start<div class="topo-line"></div></div>
      <div class="topo-col">
        <div style="font-weight:700;color:var(--text2);margin-bottom:5px">2. 생산 LOT 생성</div>
        <div class="topo-node"><div style="font-family:var(--mono);font-size:11px;color:var(--cyan);margin-bottom:4px">PRD-FAB-100</div><div style="font-weight:700;font-size:14px;margin-bottom:4px">FAB 공정 진행</div><div class="badge" style="background:var(--blue-dim);color:var(--blue)">100 WFR</div></div>
      </div>
      <div class="topo-arrow">분할 (Split)<div class="topo-line"></div></div>
      <div class="topo-col">
        <div style="font-weight:700;color:var(--text2);margin-bottom:5px">3. 분할 진행 (Split)</div>
        <div class="topo-node"><div style="font-family:var(--mono);font-size:11px;color:var(--cyan);margin-bottom:4px">PRD-FAB-100-A</div><div style="font-weight:700;font-size:14px;margin-bottom:4px">정상 라우팅 계속</div><div class="badge" style="background:var(--blue-dim);color:var(--blue)">80 WFR</div></div>
        <div class="topo-node warn"><div style="font-family:var(--mono);font-size:11px;color:var(--rose);margin-bottom:4px">PRD-FAB-100-B</div><div style="font-weight:700;font-size:14px;margin-bottom:4px">재작업(Rework) 라우팅</div><div class="badge" style="background:var(--rose-dim);color:var(--rose)">20 WFR</div></div>
      </div>
      <div class="topo-arrow">병합 (Merge)<div class="topo-line"></div></div>
      <div class="topo-col">
        <div style="font-weight:700;color:var(--text2);margin-bottom:5px">4. 최종 병합 및 EDS</div>
        <div class="topo-node"><div style="font-family:var(--mono);font-size:11px;color:var(--purple);margin-bottom:4px">EDS-TEST-999</div><div style="font-weight:700;font-size:14px;margin-bottom:4px">EDS 테스트 공정</div><div class="badge" style="background:var(--purple-dim);color:var(--purple)">100 WFR (병합됨)</div></div>
      </div>
    </div>`;

  // Fill remaining panels with standard datagrids to reach 50
  for(let i=0; i<50; i++) {
    if(!$(`p${i}`).innerHTML.trim()) {
      let tName = tabFlat[i].name;
      let colorClass = tabFlat[i].class.replace('t-', ''); // 1,2,3,4,5
      let colors = ['cyan','purple','green','red','amber'];
      let mainC = `var(--${colors[colorClass-1]})`;
      
      let rows = [];
      for(let r=1; r<=200; r++) {
        rows.push([r, genLotCode('LOT'), `${tName} 데이터 ${r}`, `<span style="color:${mainC};font-weight:700">${rInt(1,25)} WFR</span>`, '정상 처리']);
      }
      
      $(`p${i}`).innerHTML = `
        <div class="sec-hdr"><div><h3 style="color:${mainC}">${tName}</h3><span class="tip">자동 생성된 대량 데이터 뷰 (200건)</span></div><button class="btn btn-ghost">조회/새로고침</button></div>
        ${buildTable(['No', 'LOT_NO', '항목/상세', '수량', '상태'], rows, '600px')}
      `;
    }
  }
}

// Call Init
document.addEventListener("DOMContentLoaded", init);
</script>

<script>/* T3MES split — auto-activate TabPage #35 */
(function(){var I=35;
function activate(){
  var btns=document.querySelectorAll(".tab-btn");
  var btn=btns[I]||null;
  if(typeof switchTab==="function"){try{switchTab(I,btn);}catch(e){}}
  var panels=document.querySelectorAll(".panel");
  if(panels.length){
    panels.forEach(function(p,idx){p.classList.toggle("active",idx===I);});
    btns.forEach(function(b,idx){b.classList.toggle("active",idx===I);});
  }
}
function go(){try{activate();}catch(e){}}
if(document.readyState==="complete")setTimeout(go,120);else window.addEventListener("load",function(){setTimeout(go,120);});})();
</script>
</body>
