<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Monitoring Dashboard (50 Types) - Massive Full Data</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;--surface3:#252a3d;
  --border:#2a3050;--border2:#3a4570;
  --text:#e8ecf4;--text2:#a0aabf;--text3:#5a6480;
  --green:#00d68f;--green-dim:#00d68f22;--green-mid:#00d68f55;
  --red:#ff4d6d;--red-dim:#ff4d6d22;--red-mid:#ff4d6d55;
  --amber:#ffb347;--amber-dim:#ffb34722;
  --blue:#4d9fff;--blue-dim:#4d9fff22;
  --cyan:#00e5ff;--cyan-dim:#00e5ff22;
  --purple:#9d72ff;--purple-dim:#9d72ff22;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --radius:8px;--radius-lg:12px;
}

body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;overflow-y:scroll}
.app{min-height:100vh;display:flex;flex-direction:column}

/* Tab Nav (50 Tabs) */
.tab-nav{display:flex;gap:4px;padding:12px 16px 0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) var(--surface)}
.tab-nav::-webkit-scrollbar{height:8px}
.tab-nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.tab-btn{flex-shrink:0;padding:10px 16px;border:none;background:transparent;color:var(--text2);font-size:13px;font-family:var(--sans);cursor:pointer;border-radius:var(--radius) var(--radius) 0 0;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab-btn:hover{background:var(--surface2);color:var(--text)}
.tab-num{display:inline-block;background:var(--surface3);color:var(--text3);font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:4px;font-weight:700}

/* 그룹별 탭 색상 정의 */
.t-g1.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}.t-g1.active .tab-num{color:var(--blue);background:var(--blue-dim)}
.t-g2.active{color:var(--cyan);border-bottom-color:var(--cyan);font-weight:700}.t-g2.active .tab-num{color:var(--cyan);background:var(--cyan-dim)}
.t-g3.active{color:var(--green);border-bottom-color:var(--green);font-weight:700}.t-g3.active .tab-num{color:var(--green);background:var(--green-dim)}
.t-g4.active{color:var(--amber);border-bottom-color:var(--amber);font-weight:700}.t-g4.active .tab-num{color:var(--amber);background:var(--amber-dim)}
.t-g5.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:700}.t-g5.active .tab-num{color:var(--purple);background:var(--purple-dim)}

/* Panel & Card */
.panel{display:none;padding:20px;background:var(--surface2);flex:1;animation:fadeIn .2s}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;box-shadow:0 4px 6px rgba(0,0,0,0.1);position:relative}
.card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-hdr h3{font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.tip{font-size:12px;color:var(--text3);display:block;margin-top:4px}

/* Tables */
.tbl-wrap{overflow-y:auto;max-height:650px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.tbl th{position:sticky;top:0;z-index:10;padding:12px;text-align:left;font-size:12px;color:var(--text2);background:var(--surface3);border-bottom:2px solid var(--border);font-weight:700;box-shadow:0 1px 0 var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.tbl tr:hover td{background:var(--surface3)}
.tbl td.num{text-align:right;font-family:var(--mono)}

/* Visual Components */
.gauge-wrap{position:relative;width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%), var(--surface3) 0);display:flex;align-items:center;justify-content:center;margin:0 auto}
.gauge-inner{width:110px;height:110px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}
.val-lg{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--c, var(--text))}
.badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:700;font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.grid-dense{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

.prog-bg{background:var(--surface3);height:12px;border-radius:6px;overflow:hidden;flex:1;position:relative}
.prog-fill{height:100%;transition:width 0.5s ease}
.bar-h-wrap{display:flex;align-items:center;gap:12px;margin-bottom:12px}

.live-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes blink{0%,100%{background:transparent}50%{background:var(--red-dim)}}
.blink-row{animation:blink 1.5s infinite}

.map-bin{position:absolute;border:1px solid var(--border);border-radius:2px;cursor:pointer;transition:all .2s;opacity:0.8}
.map-bin:hover{border-color:var(--text);z-index:10;transform:scale(1.2);opacity:1}
</style>
<link rel="stylesheet" href="/t3mes/theme.css">
<style>/* T3MES split — hide tab nav + no-flash panel activation */.tab-nav,#tab-nav{display:none !important;}.panel{visibility:hidden;}.panel.t3split-target{visibility:visible;}html.t3split-fallback .panel.active{visibility:visible;}</style>
</head>
<body>

<div class="app">
<div class="tab-nav" id="tab-nav"></div>
<div id="panels"></div>
</div>

<script>
// --- Configuration & Data ---
const tabNames = [
  // Grp 1: 종합 & 핵심 지표 (Blue)
  "종합 재고 가치","창고 2D 레이아웃","실시간 AGV 관제","결품 위험 히트맵","장기 적치(Slow)","유통기한 임박","적정온도 모니터","공정별 재공(WIP)","출하 대기 완제품","예약 vs 가용 재고",
  // Grp 2: 자재 흐름 & 위험 (Cyan)
  "ABC 등급 분포","안전재고 위반 현황","LOT 추적성 트리","입고 대기열 실시간","피킹 정확도","재고 조사(Counting)","빈(Bin) 활용률","폐기(Scrap) 추이","백오더(결품) 상태","자재 리드타임",
  // Grp 3: 스마트 창고 & 원격 (Green)
  "PLC Raw 데이터 피드","위험물 저장 맵","크로스도킹 현황","반품(RMA) 재고","재고 회전율","경제적 주문량(EOQ)","수요예측 vs 재고","협력사 자재 배송","위탁 재고(Consignment)","공구(Toolkit) 관리",
  // Grp 4: 설비 & 환경 연동 (Amber)
  "자동창고(AS/RS) 상태","벌크(Bulk) 저장 레벨","고가 자재 트래커","WIP 에이징(Aging)","고객별 전용 재고","출하 데크(Dock) 상태","피킹 빈 보충 알림","재고 오차/손실 보고","단가 변동 모니터","냉동창고 에너지",
  // Grp 5: 로그 & Admin (Purple)
  "스캐너 스캔 로그","멀티 사이트 재고","피커(Picker) 생산성","사이클 카운팅 일정","FIFO 위반 알림","자재 이동 빈도","격리(Quarantine) 재고","파손/불량 자재","재고 데이터 품질","경영진 종합 요약"
];

// Dummy Data Pools for Richness
const materials = ['알루미늄 판재 5T','구리선 0.5mm','고강도 탄소강','에폭시 수지','리튬이온 셀','초정밀 베어링','산업용 서보모터','온도센서 모듈','PCB 메인보드','M10 육각볼트 세트','충격흡수 폼','절연 테이프','O-Ring 세트','LCD 디스플레이 10"','전원 공급장치(SMPS)'];
const products = ['산업용 로봇암','전기차 배터리팩','통신용 라우터','고성능 서버 R750','스마트 홈 허브','의료용 초음파기기','항공용 터빈 블레이드','드론 프레임 세트','전동 킥보드 조립체','에어컨 컴프레서'];
const locations = ['A-01-10','A-02-15','B-10-01','B-12-99','C-05-44','C-06-88','D-01-01','D-99-99','R-01-50','Q-05-12'];
const suppliers = ['(주)성진메탈','글로벌일렉트로닉스','태양정밀','우주폴리머','대양센서','에이펙스모터스','제일볼트','미래패키징'];

const rInt = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
const rFloat = (min,max) => (Math.random()*(max-min)+min).toFixed(2);
const formatNum = n => n.toLocaleString();
const getEl = id => document.getElementById(id);
const getRand = arr => arr[rInt(0, arr.length-1)];

// Helpers
const tblTpl = (head, rows) => `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const cardTpl = (t, c, st='') => `<div class="card" style="${st}"><div class="card-title">${t}</div>${c}</div>`;
const progTpl = (p, c, txt='') => `<div class="prog-bg"><div class="prog-fill" style="width:${p}%;background:var(--${c})"></div>${txt?`<span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;font-weight:700;color:#fff">${txt}</span>`:''}</div>`;
const sparkTpl = (c) => { let pts=''; for(let i=0;i<=20;i++) pts+=`${i*5},${rInt(10,40)} `; return `<svg width="100%" height="50"><polyline points="${pts}" fill="none" stroke="var(--${c})" stroke-width="2"/></svg>`; };
const gaugeTpl = (val, c, label) => `<div class="gauge-wrap" style="--c:var(--${c});--p:${val>100?100:val}"><div class="gauge-inner"><span class="val-lg live-num" style="--c:var(--${c})">${val}</span></div></div><div style="text-align:center;margin-top:12px;font-weight:700;color:var(--text2)">${label}</div>`;

// Main Init
function initTabs() {
  const nav = getEl('tab-nav');
  const panels = getEl('panels');
  
  tabNames.forEach((n, i) => {
    let grp = Math.floor(i / 10) + 1;
    let btn = document.createElement('button');
    btn.className = `tab-btn t-g${grp} ${i===0?'active':''}`;
    btn.innerHTML = `${n} <span class="tab-num">${i+1}</span>`;
    btn.onclick = () => switchTab(i, btn);
    nav.appendChild(btn);

    let panel = document.createElement('div');
    panel.className = `panel ${i===0?'active':''}`;
    panel.id = `p${i}`;
    let isLive = [0,2,6,13,20,30,40,49].includes(i);
    panel.innerHTML = `<div class="sec-hdr"><div><h3>${isLive?'<div class="live-dot" style="margin-right:8px"></div>':''}${i+1}. ${n} Dashboard</h3><span class="tip">실시간 업데이트 및 상세 조회 데이터입니다.</span></div></div><div id="v${i}"></div>`;
    panels.appendChild(panel);
  });

  renderAllPanels();
  
  // Live Value Updater
  setInterval(() => {
    const act = document.querySelector('.panel.active');
    if(!act) return;
    act.querySelectorAll('.live-num').forEach(el => {
      let v = parseFloat(el.innerText.replace(/,/g,''));
      if(isNaN(v)) return;
      let next = v + (Math.random()-0.5)*(v*0.05); // 5% fluctuation
      el.innerText = next % 1 !== 0 ? next.toFixed(2) : Math.floor(next).toLocaleString();
    });
  }, 1500);
}

function switchTab(i, btnEl) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  btnEl.classList.add('active');
  document.querySelectorAll('.panel').forEach((p, idx) => p.classList.toggle('active', idx===i));
}

// --- Render Generators (50 Panels) ---
function renderAllPanels() {
  g0(); g1(); g2(); g3(); g4(); g5(); g6(); g7(); g8(); g9();
  g10(); g11(); g12(); g13(); g14(); g15(); g16(); g17(); g18(); g19();
  g20(); g21(); g22(); g23(); g24(); g25(); g26(); g27(); g28(); g29();
  g30(); g31(); g32(); g33(); g34(); g35(); g36(); g37(); g38(); g39();
  g40(); g41(); g42(); g43(); g44(); g45(); g46(); g47(); g48(); g49();
}

// Group 1: 종합 & 핵심 (Blue)
function g0() {
  let h=''; ['총 재고 가치(Total)','원자재(RM) 가치','재공품(WIP) 가치','완제품(FG) 가치'].forEach((t,i)=>{
    let p=[98, 45, 20, 35][i]; let c=['green','blue','amber','cyan'][i]; let v=[125.4, 45.2, 20.1, 60.1][i];
    h+=cardTpl(t, `<div class="gauge-wrap" style="--c:var(--${c});--p:${p}"><div class="gauge-inner"><span class="val-lg live-num" style="--c:var(--${c})">${v}</span><span style="font-size:11px;color:var(--text2)">억 KRW</span></div></div><div style="text-align:center;margin-top:16px;font-weight:700;color:var(--text2)">목표 대비 ${p}% 수준</div>`, 'text-align:center');
  });
  getEl('v0').innerHTML = `<div class="grid4">${h}</div>` + cardTpl('일별 재고 가치 변동 추이 (최근 30일)', (()=>{let p='';for(let i=0;i<=20;i++)p+=`${i*5},${rInt(10,40)} `;return `<div style="height:250px;background:var(--surface3);border-radius:8px;padding:10px"><svg width="100%" height="100%" viewBox="0 0 100 50" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="var(--blue)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>`;})());
}
function g1() {
  let h = `<div style="position:relative;width:100%;height:600px;background:var(--surface3);border-radius:8px;border:1px solid var(--border);background-image:linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);background-size:30px 30px;">`;
  for(let i=0;i<800;i++){
    let st=rInt(0,10); let c=st>8?'red':st>5?'amber':st>1?'green':'border2';
    let x=rInt(0,98); let y=rInt(0,98);
    h+=`<div class="map-bin" style="left:${x}%;top:${y}%;width:12px;height:12px;background:var(--${c})" title="Bin Location: ${x}-${y}\nStatus: ${c}"></div>`;
  } getEl('v1').innerHTML = cardTpl('메인 창고 2D 맵 (전체 Bin 적재 상태 조감도)', h + '</div><div style="display:flex;gap:20px;justify-content:center;margin-top:10px"><span style="color:var(--green)">■ 적정</span><span style="color:var(--amber)">■ 과적</span><span style="color:var(--red)">■ 결품위험</span><span style="color:var(--border2)">■ 공실</span></div>');
}
function g2() {
  let h=''; for(let i=1;i<=50;i++){
    let stat = rInt(1,10); let sText = stat>8?'충전중':stat>2?'주행/이송중':'대기중'; let sCol = stat>8?'amber':stat>2?'green':'text3';
    h+=`<div style="display:flex;align-items:center;padding:16px;border-bottom:1px solid var(--border);background:var(--surface)"><div class="${stat>2&&stat<9?'live-dot':''}" style="margin-right:15px;background:var(--${sCol})"></div><b style="font-family:var(--mono);font-size:16px;width:100px">AGV-${String(i).padStart(3,'0')}</b> <span style="width:120px;color:var(--${sCol});font-weight:700">${sText}</span> <span style="flex:1">경로: ${getRand(locations)} ➔ ${getRand(locations)}</span> <span style="width:100px;text-align:right">적재: ${rInt(0,100)}%</span> <span style="width:150px;text-align:right;color:var(--green)">배터리 ${rInt(20,100)}%</span></div>`;
  }
  getEl('v2').innerHTML = cardTpl('실시간 물류 로봇(AGV/AMR) 관제 모니터링', `<div style="height:600px;overflow-y:auto">${h}</div>`);
}
function g3() {
  let h=''; for(let i=0;i<100;i++){ let p=rInt(1,100); let c=p>85?'red':p>60?'amber':p>20?'green':'surface3'; h+=`<div style="background:var(--${c});border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff">${p}%</div>`; }
  getEl('v3').innerHTML = cardTpl('결품 위험 품목 히트맵 (안전재고 대비 현재고 비율)', `<div style="display:grid;grid-template-columns:repeat(10,1fr);grid-auto-rows:40px;gap:8px">${h}</div>`);
}
function g4() {
  let rows=[]; for(let i=1;i<=100;i++){ let d=rInt(90,700); let c=d>365?'red':d>180?'amber':'text'; rows.push(`<tr><td style="font-family:var(--mono);color:var(--blue)">RM-${rInt(10000,99999)}</td><td>${getRand(materials)}</td><td class="num">${formatNum(rInt(100,50000))}</td><td class="num" style="color:var(--${c});font-weight:700">${d} 일</td><td>${getRand(locations)}</td><td><span class="badge" style="background:var(--${c}-dim);color:var(--${c})">${d>365?'악성재고':'주의'}</span></td></tr>`); }
  getEl('v4').innerHTML = tblTpl(['자재코드','자재명','재고량','적치기간(Aging)','저장위치','상태판정'], rows);
}
function g5() {
  let rows=[]; for(let i=1;i<=100;i++){ let d=rInt(1,90); let c=d<7?'red':d<30?'amber':'green'; rows.push(`<tr><td style="font-family:var(--mono)">LOT-${rInt(100000,999999)}</td><td>${getRand(materials)} (화학/접착류)</td><td class="num">${formatNum(rInt(10,500))} Kg</td><td style="color:var(--${c});font-weight:700">D-${d}</td><td>${getRand(suppliers)}</td></tr>`); }
  getEl('v5').innerHTML = tblTpl(['LOT NO','품목명','잔여수량','유통기한/사용기한','공급사'], rows);
}
function g6() {
  let h=''; for(let i=1;i<=8;i++){ let t=rFloat(-25, 5); let isWarn=t>-15; h+=cardTpl(`냉동/냉장 창고 ${i}호구역`, `<div class="val-lg live-num" style="text-align:center;font-size:50px;padding:30px 0;--c:var(--${isWarn?'red':'cyan'})">${t}</div><div style="text-align:center;color:var(--text2)">기준: -20℃ 이하 유지</div>`, isWarn?'border-color:var(--red);background:var(--red-dim)':''); }
  getEl('v6').innerHTML = `<div class="grid4">${h}</div>`;
}
function g7() {
  let h=''; for(let i=1;i<=15;i++){ let p=rInt(10,100); let c=p>80?'red':p>50?'amber':'blue'; h+=`<div class="bar-h-wrap"><div style="width:150px;font-weight:700">공정 ST-${String(i).padStart(2,'0')}</div>${progTpl(p, c, `${p}% 적체`)}<div class="num val" style="font-size:16px;width:100px;--c:var(--${c})">${formatNum(p*rInt(10,50))} EA</div></div>`; }

<script>/* T3MES split — auto-activate TabPage #45 (no-flash) */
(function(){var I=45,done=false;
function activate(){
  var panels=document.querySelectorAll(".panel");
  if(!panels.length)return false;
  var btns=document.querySelectorAll(".tab-btn");
  var btn=btns[I]||null;
  if(typeof switchTab==="function"){try{switchTab(I,btn);}catch(e){}}
  panels.forEach(function(p,idx){
    p.classList.toggle("active",idx===I);
    p.classList.toggle("t3split-target",idx===I);
  });
  btns.forEach(function(b,idx){b.classList.toggle("active",idx===I);});
  done=true;return true;
}
function tick(){if(done)return;try{activate();}catch(e){}}
if(document.readyState!=="loading")tick();
document.addEventListener("DOMContentLoaded",tick);
window.addEventListener("load",function(){
  tick();setTimeout(tick,60);setTimeout(tick,200);setTimeout(tick,500);
});
setTimeout(function(){
  if(!done)document.documentElement.classList.add("t3split-fallback");
},1500);
})();
</script>
