<!DOCTYPE html>
<meta charset="UTF-8">
<title>3D 디지털트윈 뷰</title>
<!-- T3MES UI Pattern · mes_tracking_1_order · TabPage #8: 3D 디지털트윈 뷰 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p7">
    <div class="sec-hdr"><div><h3>⑧ 3D 디지털 트윈 공장 뷰 (3D Factory Track)</h3><span class="tip">글자 표를 넘어, 내 주문이 현재 공장 도면의 어느 구역(조립반, 검사실, 포장반)에 머물고 있는지 3D 모델 위에 핀을 띄웁니다.</span></div></div>
    <div class="map-canvas" style="display:flex;align-items:center;justify-content:center;perspective:1000px">
      <div style="width:80%;height:80%;background:repeating-linear-gradient(45deg, var(--surface) 0, var(--surface) 20px, var(--surface2) 20px, var(--surface2) 40px);border:2px solid var(--cyan);transform:rotateX(60deg) rotateZ(-45deg);position:relative;box-shadow:0 20px 50px rgba(0,0,0,0.5);border-radius:12px">
        <div style="position:absolute;top:20%;left:20%;width:60px;height:60px;background:var(--blue);border-radius:8px;transform:translateZ(30px);box-shadow:10px 10px 20px rgba(0,0,0,0.5)"></div>
        <div style="position:absolute;top:20%;left:20%;transform:translate(-30px, -60px) rotateZ(45deg) rotateX(-60deg);background:var(--cyan);color:#000;padding:4px 10px;border-radius:20px;font-weight:700;font-size:12px;box-shadow:0 5px 10px rgba(0,0,0,0.3)">📍 내 주문 (조립구역)</div>
        <div style="position:absolute;top:60%;left:70%;width:80px;height:40px;background:var(--surface3);border-radius:4px;transform:translateZ(10px)"></div>
        <div style="position:absolute;top:60%;left:70%;transform:translate(-10px, -40px) rotateZ(45deg) rotateX(-60deg);color:var(--text2);font-size:10px;font-weight:700">검사 구역 (Next)</div>
      </div>
    </div>
  </div>
