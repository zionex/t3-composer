<title>모바일 서명</title>

<div class="panel" id="p10">
    <div class="sec-hdr"><div><h3>⑪ 모바일 배송완료 서명 (Proof of Delivery - POD)</h3><span class="tip">배송 기사가 현장에 도착해 물건을 넘기고 고객의 사인을 스마트폰으로 직접 받는 모바일 앱 UI입니다.</span></div></div>
    <div class="mobile-frame">
      <div style="padding:20px;background:var(--rose);color:#fff;font-weight:700">배송 완료 처리</div>
      <div style="padding:20px">
        <div style="font-weight:700;font-size:16px">수령인: 김고객 점장</div><div style="color:var(--text2);margin-bottom:20px">서울 강남구 테헤란로 123</div>
        <div style="border:2px dashed var(--border2);height:150px;display:flex;align-items:center;justify-content:center;color:var(--text3);margin-bottom:20px;background:var(--surface)">[고객 서명 (Sign) 영역]</div>
        <button class="btn btn-rose" style="width:100%;padding:14px;font-size:16px" onclick="showToast('서명이 서버로 전송되어 출하가 최종 완료(Closed) 되었습니다.')">서명 및 배송 완료 (Submit)</button>
      </div>
    </div>
  </div>
