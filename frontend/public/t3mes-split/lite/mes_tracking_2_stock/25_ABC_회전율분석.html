<div class="panel" id="p24">
    <div class="sec-hdr"><div><h3>㉕ 재고 회전율 및 ABC 등급 분석 (ABC Analysis)</h3><span class="tip">가치가 높고 자주 팔리는 A등급 자재와 1년에 한 번 쓰일까 말까 한 C등급 자재를 분류하여 관리 수준을 다르게 합니다.</span></div></div>
