<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchase Management Monitoring Dashboard (50 Types) - Fixed Full Data</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* 구매관리 테마 색상 (MRP 연계) */
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;--surface3:#252a3d;
  --border:#2a3050;--border2:#3a4570;
  --text:#e8ecf4;--text2:#a0aabf;--text3:#5a6480;
  --blue:#4d9fff;--blue-dim:#4d9fff22;
  --cyan:#00e5ff;--cyan-dim:#00e5ff22;
  --green:#00d68f;--green-dim:#00d68f22;
  --amber:#ffb347;--amber-dim:#ffb34722;
  --red:#ff4d6d;--red-dim:#ff4d6d22;
  --purple:#9d72ff;--purple-dim:#9d72ff22;
  --orange:#ff8c00;--orange-dim:#ff8c0022;
  
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --radius:8px;--radius-lg:12px;
}

body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;overflow-y:scroll}
.app{min-height:100vh;display:flex;flex-direction:column}

/* Tab Nav (50 Tabs) */
.tab-nav{display:flex;gap:4px;padding:12px 16px 0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) var(--surface)}
.tab-nav::-webkit-scrollbar{height:8px}
.tab-nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.tab-btn{flex-shrink:0;padding:10px 16px;border:none;background:transparent;color:var(--text2);font-size:13px;font-family:var(--sans);cursor:pointer;border-radius:var(--radius) var(--radius) 0 0;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab-btn:hover{background:var(--surface2);color:var(--text)}
.tab-num{display:inline-block;background:var(--surface3);color:var(--text3);font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:4px;font-weight:700}

/* 그룹별 탭 색상 정의 (10개씩 그라데이션) */
.t-g1.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}.t-g1.active .tab-num{color:var(--blue);background:var(--blue-dim)}
.t-g2.active{color:var(--cyan);border-bottom-color:var(--cyan);font-weight:700}.t-g2.active .tab-num{color:var(--cyan);background:var(--cyan-dim)}
.t-g3.active{color:var(--green);border-bottom-color:var(--green);font-weight:700}.t-g3.active .tab-num{color:var(--green);background:var(--green-dim)}
.t-g4.active{color:var(--amber);border-bottom-color:var(--amber);font-weight:700}.t-g4.active .tab-num{color:var(--amber);background:var(--amber-dim)}
.t-g5.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:700}.t-g5.active .tab-num{color:var(--purple);background:var(--purple-dim)}

/* Panel & Card */
.panel{display:none;padding:20px;background:var(--surface2);flex:1;animation:fadeIn .2s}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;box-shadow:0 4px 6px rgba(0,0,0,0.1);position:relative}
.card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-hdr h3{font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.tip{font-size:12px;color:var(--text3);display:block;margin-top:4px}

/* Tables */
.tbl-wrap{overflow-y:auto;max-height:650px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.tbl th{position:sticky;top:0;z-index:10;padding:12px;text-align:left;font-size:12px;color:var(--text2);background:var(--surface3);border-bottom:2px solid var(--border);font-weight:700;box-shadow:0 1px 0 var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.tbl tr:hover td{background:var(--surface3)}
.tbl td.num{text-align:right;font-family:var(--mono)}

/* Visual Components (Gauges, Bars, Maps) */
.gauge-wrap{position:relative;width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%), var(--surface3) 0);display:flex;align-items:center;justify-content:center;margin:0 auto}
.gauge-inner{width:110px;height:110px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}
.val-lg{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--c, var(--text))}
.badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:700;font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.grid-dense{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

.prog-bg{background:var(--surface3);height:12px;border-radius:6px;overflow:hidden;flex:1;position:relative}
.prog-fill{height:100%;transition:width 0.5s ease}
.bar-h-wrap{display:flex;align-items:center;gap:12px;margin-bottom:12px}

.live-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes blinkRow{0%,100%{background:transparent}50%{background:var(--red-dim)}}
.blink-row{animation:blinkRow 1s infinite}

.map-cnt{position:relative;width:100%;height:500px;background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.map-port{position:absolute;width:16px;height:16px;background:var(--blue);border-radius:50%;border:2px solid #fff;box-shadow:0 0 15px var(--blue)}
</style>
<style>/* T3MES split — hide tab nav + no-flash panel activation */.tab-nav,#tab-nav{display:none !important;}.panel{visibility:hidden;}.panel.t3split-target{visibility:visible;}html.t3split-fallback .panel.active{visibility:visible;}</style>
</head>
<body>

<div class="app">
<div class="tab-nav" id="tab-nav"></div>
<div id="panels"></div>
</div>

<script>
// --- Configuration & Copious Data ---
const tabNames = [
  // G1: 종합 & 핵심 지표 (Blue)
  "구매 총괄 대시보드","품목별 수급 현황","긴급 발주 모니터","구매 예산 집행률","공급망 지리적 분포","미승인 구매요청","소요량(MRP) 연계","대금 지급 스케줄","원자재 가격 동향","구매 리드타임 분석",
  // G2: 협력사 & 위험 (Cyan)
  "협력사 성과(SRM)","공급 위험(Risk)지도","핵심자재 단독소싱","협력사 품질 부적합","신규 업체 평가","계약 만료 임박","통관 진행 모니터","해상 운송 트래킹","항공 운송 지연","포워더별 퍼포먼스",
  // G3: 입고 & 품질 (Green)
  "금일 입고 예정","입고 대기열 실시간","수입검사(IQC) 현황","검사 불합격 격리","창고 빈(Bin) 적재률","미입고 잔량(Backlog)","반품(RMA) 진행","샘플 검사 결과","입고 오류 로그","로우 데이터 실시간",
  // G4: 비용 & 재무 (Amber)
  "PO 단가 변동 감지","LME 가격 연동","외자 구매 환율","TCO(총소유비용)","할인/네고 실적","미지급금(AP) 현황","인보이스 대조 오류","선급금 지급 추적","운송비용 분석","금형/치공구 자산",
  // G5: 프로세스 & Admin (Purple)
  "결재 정체 모니터","전자계약 체결 현황","그린 구매(ESG)","SOP 준수율 감지","사용자 활동 로그","마스터 데이터 오류","시스템 인터페이스","RPA 수행 현황","모바일 발주 승인","임원용 요약 보고"
];

// 전역 더미 데이터 풀 (모든 함수에서 안전하게 참조 가능)
const mats = ['철강코일 A 1.2T','알루미늄 잉곳','구리선 0.5mm','박막 트랜지스터','PCB 메인보드','에폭시 수지','IC 칩셋(MCU)','저항기 세트','커패시터 10uF','반도체 웨이퍼','LCD 패널 10"','커넥터 12Pin','충전식 셀','강화유리','사출 부품 A','엔진 피스톤'];
const sups = ['(주)한성스틸','미래금속','상하이일렉트릭','도쿄전자','독일화학AG','대만세미코','한국PCBA','Global Logistics','미국실리콘밸리','동남아사출','오사카정밀'];
const ports = ['부산항','인천항','광양항','상하이','싱가포르','로스앤젤레스','로테르담','함부르크','요코하마','홍콩','캄라'];
const locations = ['A-01-10','B-12-99','C-05-44','D-99-99','R-01-50'];
const customers = ["삼성전자","현대차","SK하이닉스","LG화학","네이버","카카오","쿠팡"];
const products = ["서버 랙(42U)","엔터프라이즈 스토리지","AI GPU 서버","네트워크 스위치","보안 방화벽 장비"];
const reps = ["김구매","이발주","박입고","최품질","정원가","강계약"];
const visualColors = ['blue','cyan','green','amber','red','purple','orange'];

const rInt = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
const rFloat = (min,max) => (Math.random()*(max-min)+min).toFixed(2);
const formatNum = n => n.toLocaleString();
const getEl = id => document.getElementById(id);
const getRand = arr => arr[rInt(0, arr.length-1)];

// --- Helper Functions for Rich Content ---
const tblTpl = (head, rows) => `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const cardTpl = (t, c, st='') => `<div class="card" style="${st}"><div class="card-title">${t}</div>${c}</div>`;
const progTpl = (p, c, txt='') => `<div class="prog-bg"><div class="prog-fill" style="width:${p}%;background:var(--${c})"></div>${txt?`<span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;font-weight:700;color:#fff">${txt}</span>`:''}</div>`;
const gaugeTpl = (p, c, label) => `<div class="gauge-wrap" style="--c:var(--${c});--p:${p>100?100:p}"><div class="gauge-inner"><span class="val-lg live-num" style="--c:var(--${c})">${p}</span><span style="font-size:11px;color:var(--text2)">%</span></div></div><div style="text-align:center;margin-top:12px;font-weight:700">${label}</div>`;
const sparkTpl = (c, h=50) => { let pts=''; for(let i=0;i<20;i++) pts+=`${i*10},${rInt(10,h-10)} `; return `<svg width="100%" height="${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--${c})" stroke-width="2"/></svg>`; };

// --- Core Initialization ---
function initTabs() {
  const nav = getEl('tab-nav');
  const panels = getEl('panels');
  
  tabNames.forEach((n, i) => {
    let grp = Math.floor(i / 10) + 1; if(grp > 5) grp=5;
    let btn = document.createElement('button');
    btn.className = `tab-btn t-g${grp} ${i===0?'active':''}`;
    btn.innerHTML = `${n} <span class="tab-num">${i+1}</span>`;
    btn.onclick = () => switchTab(i, btn);
    nav.appendChild(btn);

    let panel = document.createElement('div');
    panel.className = `panel ${i===0?'active':''}`;
    panel.id = `p${i}`;
    let isLive = [0,2,11,17,21,29,40,44].includes(i);
    panel.innerHTML = `<div class="sec-hdr"><div><h3>${isLive?'<div class="live-dot" style="margin-right:8px"></div>':''}${i+1}. ${n} Monitor</h3><span class="tip">실시간 전사 구매관리 데이터 시각화</span></div></div><div id="v${i}"></div>`;
    panels.appendChild(panel);
  });

  renderAllPanels();
  
  // Live Value Auto Updater
  setInterval(() => {
    const act = document.querySelector('.panel.active');
    if(!act) return;
    act.querySelectorAll('.live-num').forEach(el => {
      let v = parseFloat(el.innerText.replace(/,/g,''));
      if(isNaN(v)) return;
      let next = v + (Math.random()-0.5)*(v*0.02); // 2% fluctuation
      el.innerText = next % 1 !== 0 ? next.toFixed(2) : Math.floor(next).toLocaleString();
    });
  }, 2500);
}

function switchTab(i, btnEl) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  btnEl.classList.add('active');
  document.querySelectorAll('.panel').forEach((p, idx) => p.classList.toggle('active', idx===i));
}

// --- Mass Rendering - 50 Panels ---
function renderAllPanels() {
  for(let i=0; i<50; i++){
    try { 
      window['g'+i](); 
    } catch(e) { 
      console.error(`Error in g${i}: `, e);
      getEl('v'+i).innerHTML = `<div class="card" style="border-color:var(--red)">Render Error in Tab ${i+1}: ${e.message}</div>`; 
    }
  }
}

// --- Group 1: 종합 & 핵심 (Blue) ---
function g0() { // 구매 총괄
  let h=''; ['금월 발주액','납기 준수율','예산 대비 현황','품질 합격률'].forEach((t,i)=>{
    let p=[95, 88, 72, 99][i]; let c=['blue','cyan','green','amber'][i];
    h+=cardTpl(t, `<div class="gauge-wrap" style="--c:var(--${c});--p:${p}"><div class="gauge-inner"><span class="val-lg live-num" style="--c:var(--${c})">${[12.5, 88.2, 72.1, 99.5][i]}</span><span style="font-size:11px;color:var(--text2)">${i===0?'억':'%'}</span></div></div>`, 'text-align:center');
  });
  getEl('v0').innerHTML = `<div class="grid4">${h}</div>` + cardTpl('일별 발주 및 입고 추이', `<div style="height:200px;background:var(--surface3);border-radius:8px;padding:10px">${sparkTpl('blue', 180)}</div>`);
}
function g1() { // 품목별 수급
  let rows=[]; for(let i=1;i<=150;i++){
    let st=rInt(1,3); let c = st==1?'green':st==2?'amber':'red';
    rows.push(`<tr><td>RM-${rInt(1000,9999)}</td><td>${getRand(mats)}</td><td class="num">${formatNum(rInt(1000,10000))}</td><td class="num" style="color:var(--green)">${formatNum(rInt(500,5000))}</td><td class="num" style="color:var(--red)">${formatNum(rInt(100,2000))}</td><td>${progTpl(rInt(30,100),c)}</td><td>${getRand(sups)}</td></tr>`);
  } getEl('v1').innerHTML = cardTpl('전사 주요 자재 재고 및 소요(MRP) 현황', tblTpl(['품목코드','품목명','현재고','발주잔량','소요량','안전재고비','주협력사'],rows));
}
function g2() { // 긴급 발주
  let h=''; for(let i=1;i<=12;i++){ h+=`<div class="card blink-row" style="margin:0;border-color:var(--red)"><div style="font-size:16px;font-weight:700;color:var(--red)">🔥 긴급: ${getRand(mats)}</div><div>발주번호: <span style="font-family:var(--mono)">PO-E${rInt(10000,99999)}</span></div><div class="num val-lg live-num" style="--c:var(--red);margin:10px 0">${formatNum(rInt(100,5000))}</div><div>납기: <span style="color:var(--red);font-weight:700">D-${rInt(1,3)}</span> | ${getRand(sups)}</div></div>`; }
  getEl('v2').innerHTML = cardTpl('생산 결품 위험에 따른 긴급 발주 현황 (실시간)', `<div class="grid-dense">${h}</div>`);
}
function g3() { // 예산 집행
  let h=''; ['원자재','소모품','설비투자','외주비'].forEach(t=>{ let p=rInt(40,110); let c=p>100?'red':p>80?'amber':'blue'; h+=`<div class="bar-h-wrap"><div style="width:80px">${t}</div>${progTpl(p>100?100:p,c)}<div class="val num live-num" style="width:60px;text-align:right;font-size:14px;--c:var(--${c})">${p}</div>%</div>`; });
  getEl('v3').innerHTML = cardTpl('구매 카테고리별 예산 집행률 모니터링', h);
}
function g4() { // 지리적 분포
  let h=''; for(let i=0;i<30;i++) h+=`<div style="position:absolute;width:12px;height:12px;background:var(--blue);border-radius:50%;opacity:${Math.random()};left:${rInt(10,90)}%;top:${rInt(10,90)}%"></div>`;
  getEl('v4').innerHTML = cardTpl('글로벌 공급사 및 주요 운송 루트 (시각화)', `<div class="map-cnt" style="background:#0a0c10 url('https://upload.wikimedia.org/wikipedia/commons/e/ec/World_Map_Blank.svg') center/cover">${h}</div>`);
}
function g5() { // 미승인 요청
  let rows=[]; for(let i=1;i<=80;i++){ rows.push(`<tr><td style="font-family:var(--mono)">PR-${rInt(10000,99999)}</td><td>${getRand(mats)}</td><td class="num">${formatNum(rInt(100,5000))}</td><td>생산팀 김철수</td><td>2024-10-${rInt(10,25)}</td><td><span class="badge" style="background:var(--purple-dim);color:var(--purple)">팀장결재</span></td><td>${rInt(2,48)}시간</td></tr>`); }
  getEl('v5').innerHTML = cardTpl('팀별 구매 요청(PR) 결재 정체 현황', tblTpl(['PR번호','품목명','요청수량','요청자','요청일','현재단계','경과시간'],rows));
}
function g6() { // MRP 연계
  getEl('v6').innerHTML = cardTpl('MRP 엔진 소요량 산출 결과 반영 모니터링', `<div style="height:250px;background:var(--surface3);border-radius:8px;padding:10px">${sparkTpl('cyan', 230)}</div><div style="text-align:center;margin-top:10px">금일 MRP 자동 발주 권고: <b style="color:var(--cyan)">1,245건</b> / 승인 처리: <b>850건</b></div>`);
}
function g7() { // 지급 스케줄
  let rows=[]; for(let i=1;i<=100;i++){ rows.push(`<tr><td>24-10-${rInt(20,31)}</td><td>${getRand(sups)}</td><td>PO-${rInt(10000,99999)}</td><td class="num val live-num" style="font-size:14px;--c:var(--blue)">₩ ${formatNum(rInt(10,500)*100000)}</td><td><span class="badge badge-blue">지급대기</span></td><td>세금계산서</td></tr>`); }

<script>/* T3MES split — auto-activate TabPage #19 (no-flash) */
(function(){var I=19,done=false;
function activate(){
  var panels=document.querySelectorAll(".panel");
  if(!panels.length)return false;
  var btns=document.querySelectorAll(".tab-btn");
  var btn=btns[I]||null;
  if(typeof switchTab==="function"){try{switchTab(I,btn);}catch(e){}}
  panels.forEach(function(p,idx){
    p.classList.toggle("active",idx===I);
    p.classList.toggle("t3split-target",idx===I);
  });
  btns.forEach(function(b,idx){b.classList.toggle("active",idx===I);});
  done=true;return true;
}
function tick(){if(done)return;try{activate();}catch(e){}}
if(document.readyState!=="loading")tick();
document.addEventListener("DOMContentLoaded",tick);
window.addEventListener("load",function(){
  tick();setTimeout(tick,60);setTimeout(tick,200);setTimeout(tick,500);
});
setTimeout(function(){
  if(!done)document.documentElement.classList.add("t3split-fallback");
},1500);
})();
</script>
