<!DOCTYPE html>
<meta charset="UTF-8">
<title>B2B 고객용 포털</title>
<!-- T3MES UI Pattern · mes_tracking_1_order · TabPage #21: B2B 고객용 포털 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p20">
    <div class="sec-hdr"><div><h3>㉑ B2B 고객용 포털 뷰 (Customer Portal)</h3><span class="tip">내부 관리자용이 아니라, 우리에게 물건을 산 기업 고객(예: 이마트 구매담당자)이 로그인해서 자기 주문을 확인하는 깔끔한 뷰입니다.</span></div></div>
    <div style="border:1px solid var(--border);border-radius:12px;overflow:hidden">
      <div style="background:var(--rose);color:#fff;padding:20px;font-size:20px;font-weight:700;display:flex;justify-content:space-between"><span>Welcome, 이마트(본사) 님</span><span>My Order Dashboard</span></div>
      <div style="padding:20px;background:var(--bg)">
        <div class="grid3" style="margin-bottom:20px">
          <div class="card" style="background:#fff;color:#000;margin:0"><div style="font-size:14px">생산/준비중</div><div style="font-size:30px;font-weight:700;color:var(--rose)">12 건</div></div>
          <div class="card" style="background:#fff;color:#000;margin:0"><div style="font-size:14px">배송중</div><div style="font-size:30px;font-weight:700;color:var(--rose)">5 건</div></div>
          <div class="card" style="background:#fff;color:#000;margin:0"><div style="font-size:14px">최근 배송완료</div><div style="font-size:30px;font-weight:700;color:var(--text3)">48 건</div></div>
        </div>
        <div class="tbl-wrap" style="background:#fff;color:#000;max-height:300px"><table class="tbl" style="color:#000"><thead><tr style="background:#f1f5f9"><th style="color:#000">PO Number (고객발주번호)</th><th style="color:#000">품목</th><th style="color:#000">배송 상태</th><th style="color:#000">예상 도착일</th></tr></thead><tbody id="tb20"></tbody></table></div>
      </div>
    </div>
  </div>
