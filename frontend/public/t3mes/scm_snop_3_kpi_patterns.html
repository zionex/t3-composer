<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&OP KPI Dictionary (Ultimate 40 KPIs Edition)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Eye-friendly Dark Pastel Theme */
  --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --border: #475569;
  --text: #f8fafc; --text2: #cbd5e1; 
  --mono: 'IBM Plex Mono', monospace; --sans: 'Noto Sans KR', sans-serif;
  
  /* Status Colors */
  --gap-up: #6ee7b7; /* Green for Plus/Good Gap */
  --gap-dn: #fca5a5; /* Red for Minus/Bad Gap */
}

body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; padding: 20px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
.header { margin-bottom: 20px; flex-shrink: 0; }
.header h1 { font-size: 24px; font-weight: 700; color: #f1f5f9; }

/* Master/Detail Layout */
.layout { display: flex; gap: 20px; flex: 1; min-height: 0; }

/* Master Pane (Left List) */
.master-pane { width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
.search-box { padding: 15px; border-bottom: 1px solid var(--border); background: var(--surface); }
.search-box input { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; outline: none; transition: 0.2s; }
.search-box input:focus { border-color: #93c5fd; }
.kpi-list { flex: 1; overflow-y: auto; }
.category-header { padding: 10px 15px; background: var(--surface2); font-weight: 700; font-size: 12px; color: #e2e8f0; position: sticky; top: 0; z-index: 10; letter-spacing: 0.5px; }
.kpi-item { padding: 12px 15px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease; }
.kpi-item:hover { background: rgba(255, 255, 255, 0.05); }
.kpi-item.active { background: rgba(147, 197, 253, 0.15); border-left: 4px solid #93c5fd; }
.kpi-name { font-weight: 500; font-size: 13px; line-height: 1.4; color: #f8fafc; }
.kpi-sub-tag { color: #94a3b8; font-size: 10px; margin-left: 6px; background: var(--surface2); padding: 2px 6px; border-radius: 4px; }

/* Detail Pane (Right Content) */
.detail-pane { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
.d-title-group { display: flex; justify-content: space-between; align-items: flex-start; }
.d-title { font-size: 24px; font-weight: 700; margin-bottom: 15px; }
.d-category { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }

/* Badges & Info Cards */
.badge-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 5px; }
.badge { background: var(--surface2); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #e2e8f0; }
.info-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
.info-title { font-size: 14px; color: #93c5fd; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.formula-box { font-family: var(--mono); background: #020617; padding: 15px; border-radius: 8px; color: #a7f3d0; font-size: 15px; margin-top: 10px; border: 1px solid #1e293b; word-break: break-all; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }

/* Dual Charts & Data Grid Area */
.charts-wrapper { display: flex; gap: 20px; margin-top: 5px; align-items: stretch;}
.chart-container-box { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
.chart-title-sub { font-size: 14px; color: var(--text); font-weight: 700; text-align: center; }
.chart-canvas-wrapper { height: 220px; position: relative; width: 100%; }

/* Data Grid (Table) */
.data-grid-wrapper { border-top: 1px dashed var(--border); padding-top: 15px; margin-top: auto; }
.kpi-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
.kpi-table th { background: var(--surface2); color: var(--text2); padding: 8px 5px; font-weight: 700; border: 1px solid var(--border); text-align: center; font-family: var(--sans);}
.kpi-table td { padding: 8px 5px; border: 1px solid var(--border); text-align: center; color: var(--text); font-weight: 500; }
.kpi-table td.gap-val { font-size: 13px; font-weight: 700; background: rgba(0,0,0,0.2); }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
::-webkit-scrollbar-track { background: var(--surface); }
</style>
</head>
<body>

<div class="header">
  <h1>📊 S&OP KPI Master Dictionary (Ultimate 40 KPIs)</h1>
  <div style="color:var(--text2);">S&OP 5대 영역 총 40개(Main 12종 / Sub 28종) 핵심 지표 마스터 데이터베이스 탑재 완료</div>
</div>

<div class="layout">
  <div class="master-pane">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="지표명 검색 (예: 납기, 수율)..." onkeyup="filterKPI()">
    </div>
    <div class="kpi-list" id="kpiList"></div>
  </div>
  <div class="detail-pane" id="detailPane">
    <div style="text-align:center; color:var(--text2); margin-top:150px;">
      <h2>👈 좌측 목록에서 지표를 선택해주세요.</h2>
    </div>
  </div>
</div>

// --- Grouping & Rendering Logic ---
const groupedData = kpiData.reduce((acc, kpi) => {
  if (!acc[kpi.cat]) acc[kpi.cat] = [];
  acc[kpi.cat].push(kpi);
  return acc;
}, {});

const listContainer = document.getElementById('kpiList');
let activeChart1 = null;
let activeChart2 = null;

function renderList(filterText = '') {
  listContainer.innerHTML = '';
  Object.keys(groupedData).sort().forEach(category => {
    const matchingItems = groupedData[category].filter(kpi => kpi.name.toLowerCase().includes(filterText.toLowerCase()));
    if (matchingItems.length === 0) return;

    const catHeader = document.createElement('div');
    catHeader.className = 'category-header';
    catHeader.innerText = category;
    listContainer.appendChild(catHeader);

    matchingItems.forEach(kpi => {
      const item = document.createElement('div');
      item.className = 'kpi-item';
      item.id = `item-${kpi.id}`;
      item.onclick = () => showDetail(kpi.id);
      
      const subTag = kpi.isSub ? `<span class="kpi-sub-tag">Sub</span>` : '';
      item.innerHTML = `
        <div style="display:flex; align-items:center;">
          <span class="kpi-name">${kpi.name}</span>${subTag}
        </div>
        <span style="color:${THEME[kpi.catKey].main}; font-size:14px;">●</span>
      `;
      listContainer.appendChild(item);
    });
  });
}

function filterKPI() { renderList(document.getElementById('searchInput').value); }

// --- Detail Pane Rendering ---
function showDetail(id) {
  document.querySelectorAll('.kpi-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`item-${id}`).classList.add('active');

  const kpi = kpiData.find(k => k.id === id);
  const detail = document.getElementById('detailPane');
  const catTheme = THEME[kpi.catKey];

  detail.innerHTML = `
    <div>
      <div class="d-category" style="background: ${catTheme.bg}; color: ${catTheme.main}; border: 1px solid ${catTheme.main};">${kpi.cat.split('. ')[1]}</div>
      <div class="d-title-group">
        <div class="d-title">${kpi.name}</div>
      </div>
      <div class="badge-group">
        <div class="badge">🏢 담당 조직: <span style="color:#f8fafc; font-weight:bold;">${kpi.dept}</span></div>
        <div class="badge">⏱️ 산출 주기: <span style="color:#f8fafc; font-weight:bold;">${kpi.freq}</span></div>
        ${kpi.isSub ? '<div class="badge" style="border-color:#64748b; color:#94a3b8;">분석용 보조 지표 (Sub)</div>' : '<div class="badge" style="border-color:#fbbf24; color:#fcd34d;">⭐ S&OP 핵심 지표 (Main)</div>'}
      </div>
    </div>

    <div class="info-card">
      <div class="info-title"><span>📝</span> KPI 개요 및 목적 (Overview)</div>
      <div style="line-height:1.6; color:#cbd5e1;">${kpi.desc}</div>
    </div>
    <div class="info-card">
      <div class="info-title"><span>🧮</span> 산출 계산식 (Formula)</div>
      <div class="formula-box">${kpi.formula}</div>
    </div>

    <div class="charts-wrapper">
      <div class="chart-container-box">
        <div class="chart-title-sub">📈 최근 6개월 트렌드 추이</div>
        <div class="chart-canvas-wrapper"><canvas id="chartTrend"></canvas></div>
        <div class="data-grid-wrapper" id="gridTrend"></div>
      </div>

      <div class="chart-container-box">
        <div class="chart-title-sub">🎯 최적화 시각화 & Gap 분석</div>
        <div class="chart-canvas-wrapper"><canvas id="chartBest"></canvas></div>
        <div class="data-grid-wrapper" id="gridBest"></div>
      </div>
    </div>
  `;

  renderDualChartsAndGrids(kpi);
}

// --- Render Chart.js + DataLabels + DataGrid (Gap) ---
function renderDualChartsAndGrids(kpi) {
  if (activeChart1) activeChart1.destroy();
  if (activeChart2) activeChart2.destroy();
  
  const mainHex = THEME[kpi.catKey].main;
  const bgRgba = THEME[kpi.catKey].bg;
  const months = ['1월', '2월', '3월', '4월', '5월', '6월'];
  Chart.defaults.color = '#94a3b8';

  // --- [1] Chart 1: Trend ---
  const ctx1 = document.getElementById('chartTrend').getContext('2d');
  activeChart1 = new Chart(ctx1, {
    type: kpi.chart1.type,
    data: {
      labels: months,
      datasets: [{
        label: kpi.chart1.label, data: kpi.chart1.data,
        backgroundColor: bgRgba, borderColor: mainHex, borderWidth: 2,
        pointBackgroundColor: '#1e293b', pointBorderColor: mainHex, pointBorderWidth: 2, pointRadius: 4,
        fill: kpi.chart1.type === 'line', tension: 0.3, borderRadius: kpi.chart1.type === 'bar' ? 4 : 0
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, datalabels: { display: false } },
      scales: { y: { beginAtZero: false, grid: { color: '#334155' } }, x: { grid: { display: false } } }
    }
  });

  // --- [1] Data Grid 1: Trend Table ---
  let trendHtml = `<table class="kpi-table">
    <thead><tr>${months.map(m => `<th>${m}</th>`).join('')}</tr></thead>
    <tbody><tr>${kpi.chart1.data.map(d => `<td>${d}</td>`).join('')}</tr></tbody>
  </table>`;
  document.getElementById('gridTrend').innerHTML = trendHtml;


  // --- [2] Chart 2: Best Representation ---
  const ctx2 = document.getElementById('chartBest').getContext('2d');
  let type2 = kpi.chart2.type;
  let chartData = { datasets: [] };
  let chartOpts = { 
    responsive: true, maintainAspectRatio: false,
    plugins: {
      datalabels: {
        color: '#fff', font: { weight: 'bold', size: 12 },
        formatter: (value) => value + (kpi.chart2.unit || ''),
        textShadowBlur: 4, textShadowColor: 'rgba(0,0,0,0.8)' 
      }
    } 
  };

  const getPalette = () => [mainHex, ...MULTI_PASTELS.filter(c => c !== mainHex)];

  if (type2 === 'doughnut' || type2 === 'pie') {
    chartData.labels = kpi.chart2.label;
    chartData.datasets.push({ data: kpi.chart2.data, backgroundColor: getPalette(), borderWidth: 2, borderColor: '#1e293b', cutout: type2 === 'doughnut' ? '60%' : '0' });
    chartOpts.plugins.legend = { position: 'right', labels: { boxWidth: 12, color: '#cbd5e1' } };
  
  } else if (type2 === 'radar') {
    chartData.labels = kpi.chart2.label;
    chartData.datasets.push({ label: '평가 지표', data: kpi.chart2.data, backgroundColor: bgRgba, borderColor: mainHex, borderWidth: 2, pointBackgroundColor: mainHex });
    chartOpts.scales = { r: { angleLines: { color: '#334155' }, grid: { color: '#334155' }, pointLabels: { color: '#f8fafc', font: {size: 11} }, ticks: { display: false } } };
    chartOpts.plugins.legend = { display: false };
    chartOpts.plugins.datalabels.color = mainHex; 
    chartOpts.plugins.datalabels.align = 'end';
  
  } else if (type2 === 'polar') {
    chartData.labels = kpi.chart2.label;
    chartData.datasets.push({ data: kpi.chart2.data, backgroundColor: getPalette().map(c => c+'CC'), borderWidth: 1, borderColor: '#1e293b' });
    chartOpts.scales = { r: { grid: { color: '#334155' }, ticks: { display: false } } };
    chartOpts.plugins.legend = { position: 'right', labels: { boxWidth: 12, color: '#cbd5e1' } };
    type2 = 'polarArea';

  } else if (type2 === 'bar_comp') {
    chartData.labels = ['비교'];
    chartData.datasets = [
      { label: kpi.chart2.label[0], data: [kpi.chart2.data[0]], backgroundColor: mainHex, borderRadius: 4, barPercentage: 0.6 },
      { label: kpi.chart2.label[1], data: [kpi.chart2.data[1]], backgroundColor: '#475569', borderRadius: 4, barPercentage: 0.6 }
    ];
    chartOpts.scales = { y: { grid: { display: false }, ticks: { display: false } }, x: { grid: { display: false }, ticks: {display: false} } };
    chartOpts.plugins.legend = { position: 'bottom', labels: { boxWidth: 12, color: '#cbd5e1' } };
    chartOpts.plugins.datalabels.anchor = 'end';
    chartOpts.plugins.datalabels.align = 'start';
    type2 = 'bar';

  } else if (type2 === 'bar_stack') {
    chartData.labels = ['구성'];
    const pColors = getPalette();
    kpi.chart2.data.forEach((val, i) => {
      chartData.datasets.push({ label: kpi.chart2.label[i], data: [val], backgroundColor: pColors[i], borderRadius: 2 });
    });
    chartOpts.scales = { x: { stacked: true, display: false }, y: { stacked: true, display: false } };
    chartOpts.plugins.legend = { position: 'bottom', labels: { boxWidth: 12, color: '#cbd5e1' } };
    type2 = 'bar';
  }

  activeChart2 = new Chart(ctx2, { type: type2, data: chartData, options: chartOpts });

  // --- [2] Data Grid 2: Best Rep Data & GAP Analysis ---
  let bestGridHtml = '';
  
  if (kpi.chart2.type === 'bar_comp') {
    let act = kpi.chart2.data[0];
    let tgt = kpi.chart2.data[1];
    let gap = act - tgt;
    let unit = kpi.chart2.unit || '';
    
    // 값이 낮을수록 좋은 지표 (isReverseGap) 처리
    let isGood = kpi.chart2.isReverseGap ? gap <= 0 : gap >= 0; 
    let gapColor = isGood ? 'var(--gap-up)' : 'var(--gap-dn)';
    let gapSign = gap > 0 ? '▲ +' : (gap < 0 ? '▼ ' : '- ');

    bestGridHtml = `<table class="kpi-table">
      <thead><tr>
        <th>${kpi.chart2.label[0]} (A)</th>
        <th>${kpi.chart2.label[1]} (B)</th>
        <th style="color:#93c5fd;">Gap (A-B)</th>
      </tr></thead>
      <tbody><tr>
        <td>${act}${unit}</td>
        <td>${tgt}${unit}</td>
        <td class="gap-val" style="color:${gapColor};">${gapSign}${Math.abs(gap).toFixed(1)}${unit}</td>
      </tr></tbody>
    </table>`;
  } else {
    let labels = kpi.chart2.label;
    if (!Array.isArray(labels)) labels = [labels];
    
    bestGridHtml = `<table class="kpi-table">
      <thead><tr>${labels.map(l => `<th>${l}</th>`).join('')}</tr></thead>
      <tbody><tr>${kpi.chart2.data.map(d => `<td>${d}</td>`).join('')}</tr></tbody>
    </table>`;
  }
  
  document.getElementById('gridBest').innerHTML = bestGridHtml;
}

// Init
window.onload = () => {
  renderList();
  if(kpiData.length > 0) showDetail(kpiData[0].id);
};
</script>
