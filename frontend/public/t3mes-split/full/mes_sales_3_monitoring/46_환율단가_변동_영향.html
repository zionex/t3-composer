<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Monitoring Dashboard (50 Types) - Massive Full Data</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Sales & CRM Monitoring Theme */
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;--surface3:#252a3d;
  --border:#2a3050;--border2:#3a4570;
  --green:#00d68f;--green-dim:#00d68f22;--red:#ff4d6d;--red-dim:#ff4d6d22;
  --amber:#ffb347;--amber-dim:#ffb34722;--blue:#4d9fff;--blue-dim:#4d9fff22;
  --pink:#ff66a3;--pink-dim:#ff66a322;--purple:#9d72ff;--purple-dim:#9d72ff22;
  --cyan:#00e5ff;--cyan-dim:#00e5ff22;--orange:#ff8a00;--orange-dim:#ff8a0022;
  --text:#e8ecf4;--text2:#a0aabf;--text3:#5a6480;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --radius:8px;--radius-lg:12px;
}

body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;overflow-y:scroll}
.app{min-height:100vh;display:flex;flex-direction:column}

/* Tab Nav (50 Tabs) */
.tab-nav{display:flex;gap:4px;padding:12px 16px 0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) var(--surface)}
.tab-nav::-webkit-scrollbar{height:8px}
.tab-nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.tab-btn{flex-shrink:0;padding:10px 16px;border:none;background:transparent;color:var(--text2);font-size:13px;font-family:var(--sans);cursor:pointer;border-radius:var(--radius) var(--radius) 0 0;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center}
.tab-btn:hover{background:var(--surface2);color:var(--text)}
.tab-num{display:inline-block;background:var(--surface3);color:var(--text3);font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:4px;margin-left:8px;font-weight:700}

/* Tab Group Colors */
.t-1.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}.t-1.active .tab-num{color:var(--blue);background:var(--blue-dim)}
.t-2.active{color:var(--cyan);border-bottom-color:var(--cyan);font-weight:700}.t-2.active .tab-num{color:var(--cyan);background:var(--cyan-dim)}
.t-3.active{color:var(--orange);border-bottom-color:var(--orange);font-weight:700}.t-3.active .tab-num{color:var(--orange);background:var(--orange-dim)}
.t-4.active{color:var(--pink);border-bottom-color:var(--pink);font-weight:700}.t-4.active .tab-num{color:var(--pink);background:var(--pink-dim)}
.t-5.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:700}.t-5.active .tab-num{color:var(--purple);background:var(--purple-dim)}

/* Panel & Card */
.panel{display:none;padding:20px;background:var(--surface2);flex:1;animation:fadeIn .2s}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;box-shadow:0 4px 6px rgba(0,0,0,0.2);position:relative}
.card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-hdr h3{font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.tip{font-size:12px;color:var(--text3);display:block;margin-top:4px}

/* Data Tables */
.tbl-wrap{overflow-y:auto;max-height:550px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.tbl th{position:sticky;top:0;z-index:10;padding:12px;text-align:left;font-size:12px;color:var(--text2);background:var(--surface3);border-bottom:2px solid var(--border);font-weight:700;box-shadow:0 1px 0 var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.tbl tr:hover td{background:var(--surface3)}
.tbl td.num{text-align:right;font-family:var(--mono)}

/* Visualization Utilities */
.val{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--c, var(--text))}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;font-family:var(--mono)}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 1.5s infinite;display:inline-block}
@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes blinkRow{0%,100%{background:transparent}50%{background:var(--red-dim)}}
.blink-row{animation:blinkRow 1s infinite}

.gauge-wrap{position:relative;width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%), var(--surface3) 0);display:flex;align-items:center;justify-content:center;margin:0 auto}
.gauge-inner{width:110px;height:110px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}

.prog-bg{background:var(--surface3);height:10px;border-radius:5px;overflow:hidden;flex:1}
.prog-fill{height:100%;background:var(--c, var(--blue));transition:width 0.5s}
.bar-h-wrap{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.chart-box{height:250px;background:var(--surface3);border-radius:8px;border:1px solid var(--border);position:relative;display:flex;align-items:flex-end;gap:4px;padding:10px;overflow:hidden}
.chart-bar-v{flex:1;background:var(--c, var(--blue));border-radius:4px 4px 0 0;min-width:10px;transition:height 0.3s}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.grid-dense{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}

/* Map & Kanban */
.map-wrap{position:relative;width:100%;height:500px;background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background-image:radial-gradient(var(--border) 1px, transparent 1px);background-size:20px 20px}
.map-pin{position:absolute;width:15px;height:15px;background:var(--c);border-radius:50%;box-shadow:0 0 15px var(--c);transform:translate(-50%,-50%);animation:pulse 2s infinite}
.kanban{display:flex;gap:16px;overflow-x:auto;padding-bottom:16px}
.k-col{width:300px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:12px;max-height:600px;overflow-y:auto}

/* Funnel */
.funnel-stage{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;margin:0 auto 4px;height:40px;background:var(--c);border-radius:4px;transition:width 0.3s}
</style>
<style>/* T3MES split — hide tab nav + no-flash panel activation */.tab-nav,#tab-nav{display:none !important;}.panel{visibility:hidden;}.panel.t3split-target{visibility:visible;}html.t3split-fallback .panel.active{visibility:visible;}</style>
</head>
<body>

<div class="app">
<div class="tab-nav" id="tab-nav"></div>
<div id="panels"></div>
</div>

<script>
// --- Configuration ---
const tabNames = [
  // G1: 실시간 매출 & 수주 (Blue)
  "일일 수주 요약","시간대별 매출 추이","실시간 수주 피드","월간 매출 달성률","전일/전주 대비 비교","대형 프로젝트 트래커","B2B vs B2C 비중","이번 달 Top 10 수주","수주 취소/반품 알림","영업사원 수주 랭킹",
  // G2: 파이프라인 & CRM (Cyan)
  "CRM 파이프라인 퍼널","마감 임박 계약","견적 발송/회수율","리드(Lead) 전환율","영업 활동 라이브러리","장기 미결재 경고","고객사별 계약 잔액","포괄계약 소진율","핵심(VIP) 고객 활동","지역별 수주 히트맵",
  // G3: 제품 & 채널 분석 (Orange)
  "품목별 파레토 분석","신제품 수주 현황","베스트셀러 Top 5","판매 채널별 비중","수주연동 재고부족경보","옵션(CPQ) 채택률","크로스셀 타격률","단가 하락/할인 감지","제품군별 마진율 추정","SaaS/구독 MRR 모니터",
  // G4: 배송 & CS 연동 (Pink)
  "수주 대비 출하 진척률","납기 지연(Backorder)경보","출하 대기 물동량","RMA 클레임 모니터","반품 사유 분석 파이","긴급 오더(Hot) 트래커","배송 완료(POD) 집계","예상 출하 캘린더 뷰","영업-생산 리드타임","악성 미수금/외상 경고",
  // G5: 목표 & AI 예측 (Purple)
  "지점별 목표 달성률","AI 매출/수요 예측","이탈 예상 고객 리스트","수요 급증(Spike) 알람","영업본부 통합 상황판","환율/단가 변동 영향","시장 점유율 시뮬레이터","경쟁사 실지(Lost) 분석","인센티브 누적 라이브","글로벌 수주 전광판"
];

const rInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const rFloat = (min, max) => (Math.random() * (max - min) + min).toFixed(1);
const fNum = n => n.toLocaleString();
const getEl = id => document.getElementById(id);

const customers = ["삼성전자","현대차","SK하이닉스","LG화학","네이버","카카오","쿠팡","배달의민족","토스","당근마켓","포스코","현대모비스","한화솔루션","대한항공","CJ제일제당"];
const products = ["서버 랙(42U)","엔터프라이즈 스토리지","AI GPU 서버","네트워크 스위치","보안 방화벽 장비","광케이블 100m","UPS 예비전원","산업용 쿨링팬","랙마운트 콘솔","스마트 랙 센서"];
const reps = ["김영업","이수주","박매출","최달성","정계약","강실적","조파이프","윤견적","장마진","임대표"];

// --- HTML Generators ---
const tblTpl = (head, rows) => `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const cardTpl = (t, c, st='') => `<div class="card" style="${st}"><div class="card-title">${t}</div>${c}</div>`;
const progTpl = (p, c) => `<div class="prog-bg"><div class="prog-fill" style="width:${p}%;--c:var(--${c})"></div></div>`;
const gaugeTpl = (p, c, label) => `<div class="gauge-wrap" style="--c:var(--${c});--p:${p}"><div class="gauge-inner"><span class="val live-val" style="--c:var(--${c})">${p}</span><span style="font-size:11px;color:var(--text2)">%</span></div></div><div style="text-align:center;margin-top:12px;font-weight:700">${label}</div>`;
const svgLine = (c) => { let pts=''; for(let i=0;i<=10;i++) pts+=`${i*10},${rInt(10,90)} `; return `<svg width="100%" height="100%" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--${c})" stroke-width="2"/></svg>`; };
const svgArea = (c) => { let pts='0,100 '; for(let i=0;i<=10;i++) pts+=`${i*10},${rInt(20,80)} `; pts+='100,100'; return `<svg width="100%" height="100%" preserveAspectRatio="none"><polygon points="${pts}" fill="var(--${c}-dim)"/><polyline points="${pts.replace(/0,100 |100,100/g,'')}" fill="none" stroke="var(--${c})" stroke-width="2"/></svg>`; };

// --- Initialize App ---
function initTabs() {
  const nav = getEl('tab-nav');
  const panels = getEl('panels');
  
  tabNames.forEach((n, i) => {
    let grp = Math.floor(i / 10) + 1; 
    let btn = document.createElement('button');
    btn.className = `tab-btn t-${grp} ${i===0?'active':''}`;
    btn.innerHTML = `${n} <span class="tab-num">${i+1}</span>`;
    btn.onclick = () => switchTab(i, btn);
    nav.appendChild(btn);

    let panel = document.createElement('div');
    panel.className = `panel ${i===0?'active':''}`;
    panel.id = `p${i}`;
    let isLive = [0,2,8,12,14,26,31,35,43,49].includes(i); // Some panels marked explicitly as Live
    panel.innerHTML = `<div class="sec-hdr"><div><h3>${isLive?'<div class="live-dot" style="margin-right:8px"></div>':''}${i+1}. ${n} Dashboard</h3><span class="tip">실시간 업데이트 데이터입니다.</span></div></div><div id="v${i}"></div>`;
    panels.appendChild(panel);
  });

  renderAll();

  // Number mutator for live feeling
  setInterval(() => {
    const act = document.querySelector('.panel.active');
    if(!act) return;
    act.querySelectorAll('.live-val').forEach(el => {
      let v = parseFloat(el.innerText.replace(/,/g,''));
      if(isNaN(v)) return;
      let next = v + (Math.random() - 0.5) * (v * 0.03); // +/- 1.5%
      if(el.innerText.includes('%')) {
        if(next>100) next=100; if(next<0) next=0;
        el.innerText = next.toFixed(1);
      } else {
        el.innerText = Math.floor(next).toLocaleString();
      }
    });
  }, 2500);
}

function switchTab(i, btnEl) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  btnEl.classList.add('active');
  document.querySelectorAll('.panel').forEach((p, idx) => p.classList.toggle('active', idx===i));
}

function renderAll() {
  for(let i=0; i<50; i++) {
    if(typeof window['g'+i] === 'function') window['g'+i]();
  }
}

// --- Group 1: Sales & Orders (Blue) ---
function g0() {
  getEl('v0').innerHTML = `<div class="grid4" style="margin-bottom:16px">
    ${cardTpl('일일 총 수주액 (KRW)', '<div class="val live-val" style="font-size:40px;--c:var(--blue)">4,520,000,000</div>')}
    ${cardTpl('일일 수주 건수', '<div class="val live-val" style="font-size:40px;--c:var(--cyan)">1,245</div>')}
    ${cardTpl('평균 객단가', '<div class="val live-val" style="font-size:40px;--c:var(--text)">3,630,522</div>')}
    ${cardTpl('목표 달성률 (Run-rate)', '<div class="val live-val" style="font-size:40px;--c:var(--green)">105.4%</div>')}
  </div>` + cardTpl('시간대별 수주 누적 곡선', `<div style="height:250px;background:var(--surface3);border-radius:8px">${svgArea('blue')}</div>`);
}
function g1() {
  let h=''; for(let i=0;i<24;i++) h+=`<div class="chart-bar-v" style="height:${rInt(10,90)}%;--c:var(--blue)" title="${i}시"></div>`;
  getEl('v1').innerHTML = cardTpl('24시간 시간대별 매출 발생 트렌드 (막대)', `<div class="chart-box" style="gap:8px">${h}</div><div style="display:flex;justify-content:space-between;color:var(--text2);margin-top:8px"><span>00:00</span><span>12:00</span><span>23:59</span></div>`);
}
function g2() {
  let rows=[]; for(let i=1;i<=100;i++) rows.push(`<tr><td style="color:var(--text2)">14:${String(rInt(0,59)).padStart(2,'0')}:${String(rInt(0,59)).padStart(2,'0')}</td><td style="font-family:var(--mono);color:var(--blue)">SO-${rInt(1000,9999)}</td><td>${customers[i%customers.length]}</td><td>${products[i%products.length]} 외 ${rInt(1,5)}건</td><td class="num val" style="font-size:14px;--c:var(--blue)">₩ ${fNum(rInt(1,500)*100000)}</td><td><span class="badge" style="background:var(--green-dim);color:var(--green)">확정</span></td></tr>`);
  getEl('v2').innerHTML = cardTpl('실시간 전사 수주 스트림 (Live Feed)', tblTpl(['시간','SO 번호','고객사','요약','수주금액','상태'], rows));
}
function g3() {
  let h=''; ['서버사업부','스토리지부','네트워크부','클라우드부','보안솔루션부'].forEach(n=>{
    let p=rFloat(70, 110); let c=p>=100?'green':p>80?'blue':'amber';
    h+=`<div class="bar-h-wrap"><div style="width:100px">${n}</div>${progTpl(p>100?100:p, c)}<div class="val" style="font-size:16px;width:60px;text-align:right;--c:var(--${c})"><span class="live-val">${p}</span>%</div></div>`;
  });
  getEl('v3').innerHTML = cardTpl('영업 부서별 월간 매출 달성률 (Mtd)', h);
}
function g4() {
  let rows=[]; for(let i=1;i<=15;i++){ let p=rFloat(-15, 30); let c=p>0?'green':'red'; rows.push(`<tr><td>${products[i%products.length]}</td><td class="num live-val">${fNum(rInt(10,50)*1000000)}</td><td class="num live-val">${fNum(rInt(10,50)*1000000)}</td><td class="num" style="color:var(--${c});font-weight:700">${p>0?'▲':'▼'} ${Math.abs(p)}%</td></tr>`); }
  getEl('v4').innerHTML = cardTpl('제품군별 전일 대비(DoD) 수주액 비교', tblTpl(['제품군','어제 수주액(₩)','오늘 현재 수주액(₩)','증감률'], rows));
}
function g5() {
  let rows=[]; for(let i=1;i<=20;i++){ let r=rInt(10,90); rows.push(`<tr><td>Mega-Proj-2024-${i}</td><td>${customers[i%customers.length]}</td><td class="num val" style="font-size:14px;--c:var(--amber)">₩ ${fNum(rInt(5,50)*100000000)}</td><td>${progTpl(r, 'blue')}</td><td class="num">${r}%</td></tr>`); }
  getEl('v5').innerHTML = cardTpl('대형 프로젝트(1억 이상) 납품 및 청구 트래커', tblTpl(['프로젝트 명','고객사','총 계약금액','매출 인식 진척도','비율'], rows));
}
function g6() {
  getEl('v6').innerHTML = `<div class="grid2">${cardTpl('매출 비중 (B2B vs B2C)', '<div class="gauge-wrap" style="width:250px;height:250px;background:conic-gradient(var(--blue) 75%, var(--cyan) 75%);margin:20px auto"><div class="gauge-inner" style="width:180px;height:180px;font-size:20px;font-weight:700">B2B 75%<br><span style="color:var(--cyan)">B2C 25%</span></div></div>')}${cardTpl('상세 채널 비중', '<div style="margin-top:50px">'+['엔터프라이즈 (60%)','중소기업 (15%)','자사몰 (15%)','오픈마켓 (10%)'].map((n,i)=>`<div class="bar-h-wrap"><div style="width:120px">${n}</div>${progTpl([60,15,15,10][i],'blue')}</div>`).join('')+'</div>')}</div>`;
}
function g7() {
  let h=''; for(let i=1;i<=10;i++) h+=`<div class="bar-h-wrap"><div style="width:20px">${i}</div><div style="width:120px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap">${customers[i%customers.length]}</div>${progTpl((11-i)*9, 'blue')}<div class="val" style="font-size:14px">₩ ${fNum((11-i)*120000000)}</div></div>`;
  getEl('v7').innerHTML = cardTpl('이번 달 Top 10 최대 수주 (Big Deals)', h);
}

<script>/* T3MES split — auto-activate TabPage #45 (no-flash) */
(function(){var I=45,done=false;
function activate(){
  var panels=document.querySelectorAll(".panel");
  if(!panels.length)return false;
  var btns=document.querySelectorAll(".tab-btn");
  var btn=btns[I]||null;
  if(typeof switchTab==="function"){try{switchTab(I,btn);}catch(e){}}
  panels.forEach(function(p,idx){
    p.classList.toggle("active",idx===I);
    p.classList.toggle("t3split-target",idx===I);
  });
  btns.forEach(function(b,idx){b.classList.toggle("active",idx===I);});
  done=true;return true;
}
function tick(){if(done)return;try{activate();}catch(e){}}
if(document.readyState!=="loading")tick();
document.addEventListener("DOMContentLoaded",tick);
window.addEventListener("load",function(){
  tick();setTimeout(tick,60);setTimeout(tick,200);setTimeout(tick,500);
});
setTimeout(function(){
  if(!done)document.documentElement.classList.add("t3split-fallback");
},1500);
})();
</script>
