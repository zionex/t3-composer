<!DOCTYPE html>
<meta charset="UTF-8">
<title>마스터디테일</title>
<!-- T3MES UI Pattern · mes_mrp_1_order · TabPage #2: 마스터디테일 -->
<!-- 경량 마크업 조각 (AI 참조용) — 스타일/스크립트 제외, panel 레이아웃 구조만 -->
<div class="panel" id="p1">
    <div class="sec-hdr"><div><h3>② 마스터-디테일 분석형 발주</h3><span class="tip">좌측에서 부족 자재를 선택하고, 우측에서 단가 이력과 리드타임을 신중하게 비교 분석 후 발주합니다.</span></div></div>
    <div class="grid2" style="grid-template-columns: 350px 1fr">
      <div class="card" style="margin:0;padding:0;display:flex;flex-direction:column;height:600px"><div style="padding:16px;background:var(--surface3);border-bottom:1px solid var(--border);font-weight:700">부족 자재 목록 (50건)</div><div style="overflow-y:auto;flex:1" id="tb1_list"></div></div>
      <div class="card" style="margin:0"><div class="card-title" style="font-size:18px"><span id="dtl-title">MCU 32-bit (STM32)</span><span class="badge badge-red" id="dtl-short" style="font-size:14px">-3,800 EA 부족</span></div><div class="grid2" style="margin-top:20px"><div><div class="label" style="font-size:13px;margin-bottom:12px">공급사 및 단가 이력 비교</div><table class="tbl"><thead><tr><th>공급사</th><th>L/T(납기)</th><th>최근 단가</th><th>선택</th></tr></thead><tbody id="tb1_vnd"></tbody></table></div><div style="background:var(--surface2);padding:20px;border-radius:var(--radius);border:1px solid var(--border)"><div class="label" style="font-size:14px;color:var(--purple);margin-bottom:16px">신규 발주서(PO) 작성</div><div class="label">납기 요청일</div><input type="date" class="inp" value="2024-11-01" style="margin-bottom:12px"><div class="label">발주 수량 (입력)</div><input type="number" class="inp" value="4000" style="font-size:24px;font-weight:700;color:var(--purple);margin-bottom:20px"><button class="btn btn-purple" style="width:100%;padding:16px" onclick="showToast('해당 공급사로 발주서 전송 완료')">발주(PO) 확정 및 전송 ➔</button></div></div></div>
    </div>
  </div>
